<!-- Map Builder: builds real maps the game loads (terrain sculpt/paint, walls, breakable panels, upper floors/bridges, props, spawns, light/sky), then "Export".
     Unity-style layout: toolbar (Q/W/E/R) • Hierarchy + Tool Settings (left) • Scene (centre) • Inspector (right) • Project/Console dock (bottom, mapbuild/project.js) • status bar.
     source: maps/build/<id>.json • export: assets/maps/<id>.json + .glb + assets/manifest.json (same format as Blender maps)
     code: mapbuild/*.js • format/how-to: guides/MAP-BUILDER.md • UI rules: guides/TOOL-UI-RULES.md -->
<link rel="stylesheet" href="hub/tool-ui.css">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font-size:12px}
/* ---------- toolbar (Unity main toolbar) ---------- */
.tl-bar{padding:4px 8px;gap:6px;background:var(--bg2);border-bottom:1px solid var(--bg0)}
.tl-bar h1{font-size:13px;margin-right:4px}
.tl-bar .tl-btn,.tl-bar .tl-sel{padding:3px 9px;font-size:12px}
.tl-bar .grp{display:flex;gap:0;align-items:center}
.tl-bar .grp.gap{gap:4px}
#mapSel{max-width:220px}
.tseg{display:flex;border:1px solid var(--ln2);border-radius:var(--r);overflow:hidden}
.tseg button{font:inherit;font-size:14px;line-height:1;width:30px;height:24px;background:var(--bg3);color:var(--tx);border:0;border-right:1px solid var(--ln2);cursor:pointer;padding:0}
.tseg button:last-child{border-right:0}
.tseg button:hover{background:var(--bg4)}
.tseg button.on{background:var(--acc);color:#fff}
.tseg.play button{width:40px;font-size:12px}
#stat{color:var(--tx2);font-size:12px;white-space:nowrap}
#ver{font:11.5px var(--fu);color:var(--tx3);white-space:nowrap;padding:2px 7px;border:1px solid var(--bg0);border-radius:4px;cursor:pointer}#ver.ok{color:var(--sok)}#ver.warn{color:var(--swarn)}
#stat.err{color:var(--serr)}#stat.ok{color:var(--sok)}#stat.warn{color:var(--swarn)}
/* ---------- docks ---------- */
main{flex:1;display:flex;min-height:0;gap:2px;background:var(--bg0)}
.dock{display:flex;flex-direction:column;min-height:0;background:var(--bg1)}
.tabs{display:flex;background:var(--bg0);height:24px;flex:none;align-items:flex-end}
.tab{padding:0 12px;height:22px;line-height:22px;font-size:12px;color:var(--tx2);background:var(--bg2);border-top:2px solid transparent;border-radius:3px 3px 0 0;margin-left:2px;white-space:nowrap}
.tab.on{background:var(--bg1);color:var(--tx);border-top-color:var(--acc)}
.pbody{flex:1;overflow-y:auto;min-height:0}
#left{width:250px;flex:none;gap:2px;background:var(--bg0)}
#left .pane{display:flex;flex-direction:column;min-height:0;background:var(--bg1)}
#hierPane{flex:1 1 45%}
#optPane{flex:1 1 55%}
#opts{padding:6px 10px}
#right{width:310px;flex:none}
#center{flex:1;min-width:0}
/* ---------- bottom dock: Project / Console (Unity) — mapbuild/project.js ---------- */
#work{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#top{flex:1;display:flex;gap:2px;min-height:0}
#bottom{flex:none;height:250px}
.split{flex:none;background:var(--bg0)}
.split.h{height:4px;cursor:ns-resize}
.split.v{width:4px;cursor:ew-resize}
.split:hover,.split.on{background:var(--acc)}
.tabs .tab[data-tab]{cursor:pointer}
.tab b{font:600 10.5px var(--fu);padding:0 5px;border-radius:7px;margin-left:3px}.tab b:empty{display:none}
.tab b.e{background:var(--serr);color:#fff}.tab b.w{background:var(--swarn);color:#000}
.ppane{flex:1;display:flex;flex-direction:column;min-height:0}
.ppane[hidden]{display:none}
.pbar{display:flex;align-items:center;gap:3px;height:24px;padding:0 4px;background:var(--bg2);border-bottom:1px solid var(--bg0);flex:none}
.pbar .sp{flex:1}
.pbtn{font:inherit;font-size:12px;height:19px;padding:0 7px;background:var(--bg3);color:var(--tx);border:1px solid var(--ln2);border-radius:3px;cursor:pointer;white-space:nowrap}
.pbtn:hover{background:var(--bg4)}
.pbtn.tg{color:var(--tx3)}.pbtn.tg.on{background:var(--bg4);color:var(--tx);border-color:var(--tx3)}
.pbtn.tg.w.on{color:var(--swarn)}.pbtn.tg.e.on{color:var(--serr)}
.psearch{display:flex;align-items:center;gap:4px;width:220px;max-width:40%;height:19px;padding:0 6px;background:var(--bg0);border:1px solid var(--ln2);border-radius:10px;color:var(--tx3)}
.psearch:focus-within{border-color:var(--acc)}
.psearch input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:12px;padding:0}
.pmain{flex:1;display:flex;min-height:0}
#ptree{width:210px;flex:none;padding:2px 0 8px;font-size:12px}
#ptree .hrow{height:19px}
#ptree .pfi{width:15px;height:13px;flex:none;color:var(--tx2);display:flex}
#ptree .pfi svg{width:15px;height:13px}
#ptree .pnm{overflow:hidden;text-overflow:ellipsis}
.psep{height:6px}
.pright{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg1)}
#pcrumb{display:flex;align-items:center;gap:1px;height:22px;padding:0 6px;border-bottom:1px solid var(--ln);flex:none;font-size:12px;white-space:nowrap;overflow:hidden}
#pcrumb .sp{flex:1}
.pcb{font:inherit;font-size:12px;background:none;border:0;color:var(--tx2);padding:1px 4px;border-radius:3px;cursor:pointer}
.pcb:hover{background:var(--hov);color:var(--tx)}.pcb.last{color:var(--tx);font-weight:600}
.pcs{color:var(--tx3);padding:0 1px}
.pcl{color:var(--tx2);margin-right:6px}
.pseg{display:flex;border:1px solid var(--ln2);border-radius:3px;overflow:hidden}
.pseg button{font:inherit;font-size:11.5px;background:var(--bg3);color:var(--tx2);border:0;border-right:1px solid var(--ln2);padding:1px 8px;cursor:pointer}
.pseg button:last-child{border-right:0}.pseg button.on{background:var(--acc);color:#fff}
.pchk{display:flex;align-items:center;gap:4px;color:var(--tx3);font-size:11.5px;cursor:pointer}
#pgrid{flex:1;overflow-y:auto;min-height:0;outline:none;align-content:start}
#pgrid.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--ts) + 14px),1fr));gap:6px 4px;padding:8px}
#pgrid .pi{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;cursor:pointer;border-radius:4px;padding:3px 2px;user-select:none;position:relative}
#pgrid .pi .ic{width:var(--ts);height:var(--ts);display:flex;align-items:center;justify-content:center;border-radius:3px;flex:none}
#pgrid.grid .pi:not(.fold) .ic{background:var(--bg0)}
#pgrid .pi .th{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .15s}
#pgrid .pi .th.ok{opacity:1}
#pgrid .pi .gl{font-size:calc(var(--ts) * .5);line-height:1}
#pgrid .pi.fold .ic{color:var(--tx2)}
#pgrid .pi.fold .ic svg{width:86%;height:86%}
#pgrid .pi .nm{max-width:100%;font-size:11.5px;line-height:15px;padding:0 4px;border-radius:3px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pgrid .pi .sub{max-width:100%;margin-top:-3px;font-size:10px;line-height:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pgrid.grid .pi:hover .ic{box-shadow:0 0 0 1px var(--ln2)}
#pgrid.grid .pi.on .ic{box-shadow:0 0 0 2px var(--acc)}
#pgrid.grid .pi.on .nm{background:var(--acc);color:#fff}
#pgrid .pi.dim{opacity:.35}
#pgrid .pi.ping .ic{animation:ping .9s}
@keyframes ping{0%,60%{box-shadow:0 0 0 4px var(--acc2)}100%{box-shadow:0 0 0 2px var(--acc)}}
#pgrid .pi .fv{width:12px;height:12px;color:var(--tx);display:block}
#pgrid .pi .fv svg{width:100%;height:100%;display:block}
#pgrid.grid .pi .fv{position:absolute;top:6px;left:calc(50% + var(--ts) / 2 - 15px);filter:drop-shadow(0 0 1px #000)}
#pgrid .pi .pk{display:none}
#pgrid.list{padding:2px 0}
#pgrid.list .pi{flex-direction:row;gap:6px;height:20px;padding:0 8px;border-radius:0}
#pgrid.list .pi .ic{width:16px;height:16px}
#pgrid.list .pi .gl{font-size:12px}
#pgrid.list .pi .nm{flex:1;text-align:left;padding:0}
#pgrid.list .pi.on{background:var(--acc)}#pgrid.list .pi.on .nm{color:#fff}
#pgrid.list .pi:hover:not(.on){background:var(--hov)}
#pgrid.list .pi .pk{display:block;color:var(--tx3);font-size:11px;white-space:nowrap}#pgrid.list .pi.on .pk{color:#fff}
#pgrid.list .pi .fv{width:11px;height:11px;color:var(--tx2);flex:none}
.pempty{grid-column:1/-1;color:var(--tx3);padding:20px;text-align:center}
.pfoot{display:flex;align-items:center;gap:8px;height:20px;padding:0 8px;border-top:1px solid var(--ln);background:var(--bg2);flex:none;font:11.5px var(--fu);color:var(--tx2)}
.pfoot .sp{flex:1}
#ppath{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#psize{width:90px}
.pmenu{position:fixed;z-index:50;min-width:190px;background:var(--bg2);border:1px solid var(--ln2);border-radius:4px;padding:3px 0;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pmenu button{display:block;width:100%;text-align:left;font:inherit;font-size:12px;color:var(--tx);background:none;border:0;padding:4px 14px;cursor:pointer}
.pmenu button:hover:not(:disabled){background:var(--acc);color:#fff}.pmenu button:disabled{color:var(--tx3);cursor:default}
.pmenu .msep{height:1px;background:var(--ln2);margin:3px 0}
.pcard{display:flex;gap:8px;align-items:center;padding:5px;background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);cursor:pointer}
.pcard:hover{border-color:var(--acc)}
.pcard .ic{width:52px;height:52px;flex:none;background:var(--bg0);border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard .ic img{width:100%;height:100%;object-fit:contain}.pcard .ic .gl{font-size:26px}
.pcard .tx{display:flex;flex-direction:column;min-width:0;gap:2px}
.pcard .tx b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pcard .tx span{font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clist{flex:1;font:11.5px var(--fu)}
.crow{display:flex;gap:6px;align-items:flex-start;padding:3px 8px;border-bottom:1px solid var(--ln);cursor:default;color:var(--tx)}
.crow:nth-child(even){background:var(--hov)}
.crow.on{background:var(--accBg)}
.crow .cic{flex:none;width:14px;text-align:center}.crow.w .cic{color:var(--swarn)}.crow.e .cic{color:var(--serr)}.crow.i .cic{color:var(--tx3)}
.crow .ctm{flex:none;color:var(--tx3)}
.crow .ctx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cn{flex:none;background:var(--bg4);color:var(--tx);border-radius:8px;padding:0 6px;font-size:10.5px}
#cdet{flex:none;max-height:70px;min-height:34px;overflow:auto;padding:4px 8px;border-top:1px solid var(--ln2);background:var(--bg0);font:11.5px var(--fu);color:var(--tx2);white-space:pre-wrap}
/* ---------- hierarchy ---------- */
.hsearch{padding:4px 6px;border-bottom:1px solid var(--ln)}
.hsearch .tl-in{width:100%;padding:2px 6px;font-size:12px;background:var(--bg0)}
#hier{padding:2px 0 8px;font-size:12px}
.hrow{display:flex;align-items:center;gap:4px;height:20px;padding-right:6px;cursor:default;white-space:nowrap;overflow:hidden;color:var(--tx)}
.hrow:hover{background:var(--hov)}
.hrow.on{background:var(--accBg);box-shadow:inset 2px 0 var(--acc)}
.hrow.root{font-weight:600}
.hgrp{color:var(--tx2)}
.harr{width:12px;flex:none;color:var(--tx3);font-size:10px;text-align:center}
.hic{width:12px;flex:none;color:var(--tx3);font-size:10px;text-align:center}
.hcnt{margin-left:auto;color:var(--tx3);font:11px var(--fu)}
.hdim{color:var(--tx3)}
/* ---------- scene view ---------- */
#vbar{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--bg0);flex:none}
#vbar .tl-btn,#vbar .tl-sel{padding:1px 8px;font-size:12px}
#vbar .vsep{width:1px;height:16px;background:var(--ln2)}
#vbar label.lbl{color:var(--tx2);font-size:12px}
#view{flex:1;position:relative;min-height:0;background:var(--bg0);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:crosshair}
#cv.hand{cursor:grab}
#tools{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:1px;background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#tools button{width:30px;height:28px;background:transparent;border:0;border-radius:3px;color:var(--tx);cursor:pointer;font:inherit;font-size:15px;padding:0}
#tools button:hover{background:var(--bg4)}
#tools button.on{background:var(--acc);color:#fff}
#gv{position:absolute;inset:0;background:#000;display:none;z-index:20}
#gv.on{display:block}
#gv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#gvBar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:10px;align-items:center;background:var(--bg1);border:1px solid var(--ln2);border-radius:var(--r);padding:4px 8px;font-size:12px;color:var(--tx2);z-index:1}
#gvBar .sp{flex:1}
#gvBar .tl-btn{padding:2px 8px;font-size:12px}
#vmsg{position:absolute;top:45%;left:0;right:0;text-align:center;color:var(--tx2);pointer-events:none}
/* ---------- status bar ---------- */
#status{display:flex;gap:14px;padding:2px 10px;background:var(--bg2);border-top:1px solid var(--bg0);font:11.5px var(--fu);color:var(--tx2);white-space:nowrap;overflow:hidden}
#status #hint{font-family:var(--ui);color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
/* ---------- panels / inspector ---------- */
h3{margin:12px 0 6px;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
h3:first-child{margin-top:2px}
.sec{border-bottom:1px solid var(--bg0);padding:0 0 6px}
.sec>*:not(summary){margin-left:10px;margin-right:10px}
.sec>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--tx);list-style:none;padding:4px 8px;background:var(--bg2);border-bottom:1px solid var(--ln);margin-bottom:4px}
.sec>summary::before{content:'▸ ';color:var(--tx3)}.sec[open]>summary::before{content:'▾ '}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}
.row>label{width:42%;max-width:130px;flex:none;color:var(--tx2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tl-in,.row .tl-sel{flex:1;min-width:0;padding:2px 6px;font-size:12px;background:var(--bg0)}
.row input[type=number]{width:70px;flex:none}
.row input[type=range]{flex:1;min-width:0}
.row input[type=color]{width:44px;height:20px;padding:0;border:1px solid var(--ln2);background:var(--bg2);border-radius:var(--r);flex:none}
.row output{width:38px;text-align:right;font:12px var(--fu);color:var(--tx2);flex:none}
textarea.tl-in{width:100%;min-height:48px;resize:vertical;padding:4px 6px}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--tx2);font-size:12px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.seg .tl-btn{padding:2px 8px;font-size:12px;flex:1;white-space:nowrap}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pal button{display:flex;align-items:center;gap:6px;text-align:left;font:inherit;font-size:12px;color:var(--tx);background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);padding:3px 6px;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pal button:hover{background:var(--bg3)}
.pal button.on{border-color:var(--acc);background:var(--accBg)}
.pal.tex{grid-template-columns:1fr 1fr 1fr}
.pal.tex button{flex-direction:column;align-items:stretch;gap:2px;padding:3px;font-size:11px}
.pal.tex button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.pal.tex .th{display:block;width:100%;aspect-ratio:8/5;border-radius:3px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.12)}
.pal button .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.18)}
.pal.one{grid-template-columns:1fr}
.kit{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.kit button{background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);padding:2px;cursor:pointer;color:var(--tx2);font:inherit;font-size:10px;line-height:12px;overflow:hidden}
.kit button:hover{background:var(--bg3);color:var(--tx)}
.kit button.on{border-color:var(--acc);background:var(--accBg);color:#fff}
.kit button img,.kit button .ph{display:block;width:100%;aspect-ratio:1;background:var(--bg0);border-radius:3px;margin-bottom:2px}
.kit button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{color:var(--tx3);font-size:11.5px;line-height:1.45;margin:6px 0}
.lst{list-style:none;margin:4px 0;padding:0;font-size:12px}
.lst li{padding:3px 0 3px 18px;position:relative;color:var(--tx2);line-height:1.4}
.lst li::before{position:absolute;left:0;top:3px}
.lst li.ok::before{content:'✓';color:var(--sok)}.lst li.warn::before{content:'!';color:var(--swarn);font-weight:700;left:4px}.lst li.err::before{content:'✕';color:var(--serr)}
.lst li.err{color:var(--tx)}
.lst li a{color:var(--acc2);cursor:pointer}
kbd{font:11px var(--fu);background:var(--bg3);border:1px solid var(--ln2);border-radius:3px;padding:0 4px;color:var(--tx)}
dialog{background:var(--bg1);color:var(--tx);border:1px solid var(--ln2);border-radius:6px;padding:16px;width:420px;max-width:92vw}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:15px}
dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
/* live room panel (mapbuild/collab.js) */
.mb-room{position:fixed;z-index:60;width:290px;padding:10px 12px;background:var(--bg1);border:1px solid var(--ln2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.mb-room[hidden]{display:none}
.mb-room h4{margin:0;font-size:13px;display:flex;align-items:center}.mb-room h4 .x{margin-left:auto;cursor:pointer;color:var(--tx2);background:none;border:0;font:inherit;font-size:15px;padding:0 2px}.mb-room h4 .x:hover{color:var(--tx)}.mb-room .row{display:flex;gap:6px}.mb-room .row input{flex:1}.mb-room .note{margin:0;color:var(--tx2);font-size:12px}
.mb-room .who div{display:flex;align-items:center;gap:6px;padding:2px 0}.mb-room .who i{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="tl-bar">
  <a class="tl-home" href="hub.html">◂ Tools</a>
  <h1>Map Builder</h1>
  <div class="grp gap"><select id="mapSel" class="tl-sel" title="Map"></select><button id="bNew" class="tl-btn">＋ New</button><button id="bSave" class="tl-btn" title="Save (Ctrl+S)">Save</button></div>
  <div class="tseg"><button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button></div>
  <div class="tseg" id="gbar">
    <button data-g="hand" title="Hand Tool (Q) — left-drag pans the view, no gizmo">✋</button>
    <button data-g="translate" title="Move Tool (W) — green arrow = up/down">✥</button>
    <button data-g="rotate" title="Rotate Tool (E)">⟳</button>
    <button data-g="scale" title="Scale Tool (R) — centre cube = uniform">⤢</button>
    <button data-g="resize" title="Resize Tool (T) — drag one face, the opposite face stays put (like Roblox/Unity Rect)">⇥</button>
  </div>
  <span class="sp"></span>
  <div class="tseg play"><button id="bPlay" title="Play — export to the game, then open the game on this map">▶</button></div>
  <span class="sp"></span>
  <span id="stat"></span>
  <span id="ver" title="Map version"></span>
  <a class="tl-btn" href="mapedit.html" title="Map Editor (old): top-down sketch layout for design talks">Sketch ▸</a>
  <button id="bExport" class="tl-btn pri" title="Export — write the map files to assets/maps for the game, then commit + push only this map to GitHub (the online game). Play only exports.">⬆ Export</button>
</div>
<main>
 <div id="work">
 <div id="top">
  <div id="left" class="dock">
    <div class="pane" id="hierPane">
      <div class="tabs"><span class="tab on">☰ Hierarchy</span></div>
      <div class="hsearch"><input id="hq" class="tl-in" placeholder="Search…" autocomplete="off"></div>
      <div id="hier" class="pbody"></div>
    </div>
    <div class="pane" id="optPane">
      <div class="tabs"><span class="tab on" id="optTitle">⚙ Tool Settings</span></div>
      <div id="opts" class="pbody"></div>
    </div>
  </div>
  <div id="center" class="dock">
    <div class="tabs"><span class="tab on"># Scene</span></div>
    <div id="vbar">
      <button class="tl-btn" id="vTop" title="Top view (Shift+T)">Top</button>
      <button class="tl-btn" id="vFit" title="Frame the whole map (Home)">Frame All</button>
      <button class="tl-btn" id="vGame" title="Export, then look from this camera with the real game's rendering, light and sky">🎮 Game View</button>
      <button class="tl-btn" id="vShot" title="Capture this view as PNG (2× resolution, no grid/gizmo/selection) — downloads the file and keeps a copy in shots/">📷 PNG</button>
      <span class="vsep"></span>
      <label class="lbl" for="snapSel" title="Grid snap for moving (Move tool + dragging)">Snap</label>
      <select id="snapSel" class="tl-sel"><option value="0">Off</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1">1</option><option value="2">2</option></select>
      <span class="vsep"></span>
      <label class="chk" style="margin:0" title="On: click a selected object again and drag to move it (first click only selects). Off: move only with the gizmo (W)"><input type="checkbox" id="oDrag" checked>Drag Move</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="oGrid">Grid</label>
      <label class="chk" style="margin:0" title="Slopes too steep to walk up are shown red"><input type="checkbox" id="oSteep" checked>Too Steep</label>
      <label class="chk" style="margin:0" title="Show the game's collision shapes"><input type="checkbox" id="oCol">Colliders</label>
      <label class="chk" style="margin:0" title="Phase areas / ceilings (siege markers)"><input type="checkbox" id="oArea" checked>Areas</label>
      <label class="lbl" for="phView" title="Preview one siege phase: items on a Phase Layer outside it are hidden">Phase</label>
      <select id="phView" class="tl-sel"><option value="0">All</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
      <label class="chk" style="margin:0" title="Sky, fog and light from the map settings"><input type="checkbox" id="oSky" checked>Map Lighting</label>
    </div>
    <div id="view">
      <canvas id="cv" tabindex="0"></canvas>
      <div id="tools" title="Tools"></div>
      <div id="vmsg">Loading…</div>
      <div id="gv"><div id="gvBar"><b style="color:var(--tx)">Game View</b><span>Click the view to look around • WASD fly • Space/Ctrl up/down • Shift fast • wheel = speed</span><span class="sp"></span><span id="gvStat"></span><button class="tl-btn" id="gvRe" title="Export again from the editor camera">↻ Refresh</button><button class="tl-btn" id="gvX" title="Back to editing (Esc)">✕ Close</button></div></div>
    </div>
  </div>
  </div>
  <div id="hsplit" class="split h" title="Drag to resize"></div>
  <div id="bottom" class="dock">
    <div class="tabs"><span class="tab" data-tab="project">▤ Project</span><span class="tab" data-tab="console">≡ Console <b id="conN"></b></span></div>
    <div id="projPane" class="ppane">
      <div class="pbar">
        <button id="pAdd" class="pbtn" title="Create / Import">＋ ▾</button>
        <span class="sp"></span>
        <div class="psearch"><span>⌕</span><input id="pq" placeholder="Search" autocomplete="off" spellcheck="false"></div>
        <button id="pFav" class="pbtn" title="Favorites">★</button>
      </div>
      <div class="pmain">
        <div id="ptree" class="pbody"></div>
        <div id="vsplit" class="split v" title="Drag to resize"></div>
        <div class="pright">
          <div id="pcrumb"></div>
          <div id="pgrid" tabindex="0"></div>
          <div class="pfoot"><span id="ppath"></span><span class="sp"></span><input type="range" id="psize" min="0" max="100" title="Icon size (far left = list)"></div>
        </div>
      </div>
    </div>
    <div id="conPane" class="ppane" hidden>
      <div class="pbar">
        <button id="cClear" class="pbtn">Clear</button><button id="cfcol" class="pbtn tg">Collapse</button>
        <span class="sp"></span>
        <button id="cfi" class="pbtn tg" title="Messages">ⓘ<span> 0</span></button><button id="cfw" class="pbtn tg w" title="Warnings">⚠<span> 0</span></button><button id="cfe" class="pbtn tg e" title="Errors">⛔<span> 0</span></button>
      </div>
      <div id="clist" class="pbody"></div>
      <div id="cdet"></div>
    </div>
  </div>
 </div>
  <div id="right" class="dock">
    <div class="tabs"><span class="tab on">ⓘ Inspector</span></div>
    <div id="side" class="pbody"></div>
  </div>
</main>
<div id="status"><span id="sPos">–</span><span id="sInfo"></span><span id="hint"></span></div>
<dialog id="dlg"></dialog>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="mapbuild/app.js"></script>
</body>
</html>
