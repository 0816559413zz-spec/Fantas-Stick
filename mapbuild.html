<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Builder — Fantas Stick</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.min.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<!-- Map Builder: ทำแผนที่จริงที่เกมโหลดได้ (ปั้นพื้นเนียน ระบายพื้นผิว กำแพงอิสระ พื้นชั้นบน/สะพาน วางของอิสระ จุดเกิด แสง/ท้องฟ้า) แล้ว "ส่งเข้าเกม"
     ต้นฉบับ: maps/build/<id>.json • ส่งออก: assets/maps/<id>.json + .glb + assets/manifest.json (รูปแบบเดียวกับแผนที่จาก Blender)
     โค้ด: mapbuild/*.js • รูปแบบ/วิธีใช้: guides/MAP-BUILDER.md • กฎ UI: guides/TOOL-UI-RULES.md -->
<link rel="stylesheet" href="hub/tool-ui.css">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
.tl-bar{flex-wrap:wrap}
.tl-bar .grp{display:flex;gap:4px;align-items:center}
#mapSel{max-width:230px}
#stat{color:var(--tx2);font-size:12px;white-space:nowrap}
#stat.err{color:var(--serr)}#stat.ok{color:var(--sok)}#stat.warn{color:var(--swarn)}
main{flex:1;display:flex;min-height:0}
#tools{width:52px;background:var(--bg1);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto}
#tools button{width:44px;height:42px;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--tx2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;padding:0}
#tools button b{font-size:16px;font-weight:400;line-height:18px}
#tools button i{font-style:normal;font-size:9.5px;line-height:12px;white-space:nowrap}
#tools button:hover{background:var(--bg3);color:var(--tx)}
#tools button.on{background:var(--accBg);border-color:var(--acc);color:#fff}
#tools hr{width:32px;border:0;border-top:1px solid var(--ln);margin:4px 0}
#opts{width:236px;background:var(--bg1);border-right:1px solid var(--ln);overflow-y:auto;padding:8px 10px}
#side{width:300px;background:var(--bg1);border-left:1px solid var(--ln);overflow-y:auto}
#view{flex:1;position:relative;min-width:0;background:var(--bg0);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:crosshair}
#vbar{position:absolute;top:8px;left:8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--bg1);border:1px solid var(--ln2);border-radius:var(--r);padding:4px 8px}
#vbar .tl-btn{padding:2px 8px;font-size:12px}
#vmsg{position:absolute;top:45%;left:0;right:0;text-align:center;color:var(--tx2);pointer-events:none}
#status{display:flex;gap:14px;padding:3px 10px;background:var(--bg1);border-top:1px solid var(--ln);font:12px var(--fu);color:var(--tx2);white-space:nowrap;overflow:hidden}
#status #hint{font-family:var(--ui);color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
h3{margin:12px 0 6px;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
h3:first-child{margin-top:2px}
.sec{border-bottom:1px solid var(--ln);padding:8px 12px}
.sec>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--tx2);list-style:none;padding:2px 0}
.sec>summary::before{content:'▸ ';color:var(--tx3)}.sec[open]>summary::before{content:'▾ '}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row>label{width:92px;flex:none;color:var(--tx2);font-size:12px}
.row .tl-in,.row .tl-sel{flex:1;min-width:0;padding:3px 6px}
.row input[type=number]{width:70px;flex:none}
.row input[type=range]{flex:1;min-width:0}
.row input[type=color]{width:44px;height:24px;padding:0;border:1px solid var(--ln2);background:var(--bg2);border-radius:var(--r);flex:none}
.row output{width:38px;text-align:right;font:12px var(--fu);color:var(--tx2);flex:none}
textarea.tl-in{width:100%;min-height:48px;resize:vertical;padding:4px 6px}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--tx2);font-size:12px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.seg .tl-btn{padding:3px 8px;font-size:12px;flex:1;white-space:nowrap}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pal button{display:flex;align-items:center;gap:6px;text-align:left;font:inherit;font-size:12px;color:var(--tx);background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);padding:3px 6px;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pal button:hover{background:var(--bg3)}
.pal button.on{border-color:var(--acc);background:var(--accBg)}
.pal button .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.18)}
.pal.one{grid-template-columns:1fr}
.kit{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.kit button{background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);padding:2px;cursor:pointer;color:var(--tx2);font:inherit;font-size:10px;line-height:12px;overflow:hidden}
.kit button:hover{background:var(--bg3);color:var(--tx)}
.kit button.on{border-color:var(--acc);background:var(--accBg);color:#fff}
.kit button img,.kit button .ph{display:block;width:100%;aspect-ratio:1;background:var(--bg0);border-radius:3px;margin-bottom:2px}
.kit button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{color:var(--tx3);font-size:11.5px;line-height:1.45;margin:6px 0}
.lst{list-style:none;margin:4px 0;padding:0;font-size:12px}
.lst li{padding:3px 0 3px 18px;position:relative;color:var(--tx2);line-height:1.4}
.lst li::before{position:absolute;left:0;top:3px}
.lst li.ok::before{content:'✓';color:var(--sok)}.lst li.warn::before{content:'!';color:var(--swarn);font-weight:700;left:4px}.lst li.err::before{content:'✕';color:var(--serr)}
.lst li.err{color:var(--tx)}
.lst li a{color:var(--acc2);cursor:pointer}
kbd{font:11px var(--fu);background:var(--bg3);border:1px solid var(--ln2);border-radius:3px;padding:0 4px;color:var(--tx)}
dialog{background:var(--bg1);color:var(--tx);border:1px solid var(--ln2);border-radius:6px;padding:16px;width:420px;max-width:92vw}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:15px}
dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="tl-bar">
  <a class="tl-home" href="hub.html">◂ Tool</a>
  <h1>Map Builder</h1>
  <div class="grp"><select id="mapSel" class="tl-sel" title="แผนที่"></select><button id="bNew" class="tl-btn">＋ ใหม่</button><button id="bSave" class="tl-btn" title="Ctrl+S">บันทึก</button></div>
  <div class="grp"><button id="bUndo" class="tl-btn" title="Ctrl+Z">↶</button><button id="bRedo" class="tl-btn" title="Ctrl+Y">↷</button></div>
  <span id="stat"></span>
  <span class="sp"></span>
  <a class="tl-btn" href="mapedit.html" title="Map Editor เดิม: ผังร่างมุมบนสำหรับคุยออกแบบ">ผังร่าง ▸</a>
  <button id="bPlay" class="tl-btn" title="ส่งเข้าเกมแล้วเปิดเกมที่แผนที่นี้">▶ ทดลองเล่น</button>
  <button id="bExport" class="tl-btn pri" title="เขียนไฟล์แผนที่ลง assets/maps ให้เกมใช้">⬆ ส่งเข้าเกม</button>
</div>
<main>
  <div id="tools"></div>
  <div id="opts"></div>
  <div id="view">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="vbar">
      <button class="tl-btn" id="vTop" title="มองจากด้านบน (T)">มุมบน</button>
      <button class="tl-btn" id="vFit" title="เห็นทั้งแผนที่ (Home)">ทั้งแผนที่</button>
      <label class="chk" style="margin:0"><input type="checkbox" id="oSteep" checked>ชันเกินเดิน</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="oCol">ที่ชน</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="oGrid">กริด</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="oSky" checked>แสงตามแผนที่</label>
    </div>
    <div id="vmsg">กำลังโหลด…</div>
  </div>
  <div id="side"></div>
</main>
<div id="status"><span id="sPos">–</span><span id="sInfo"></span><span id="hint"></span></div>
<dialog id="dlg"></dialog>
<script type="module" src="mapbuild/app.js"></script>
</body>
</html>
