<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Magic Wings</title>
<style>
  html,body{margin:0;height:100%;background:#03100b;overflow:hidden;font-family:system-ui,sans-serif;color:#d8ffe9}
  canvas{display:block}
  #ui{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
  #ui button{background:#082a1d;border:1px solid #6fe3b0;color:#d8ffe9;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}
  #ui button.on{background:#1d7a55}
  #tag{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.7}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.min.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <button id="bFlap" class="on">กระพือปีก</button>
  <button id="bSpin">หมุนรอบ</button>
  <button id="bFold">หุบ/กาง</button>
  <button id="bBack">มุมหลัง</button>
  <button id="bFront">มุมหน้า</button>
  <button id="bBody" class="on">ตัวละคร</button>
  <button id="bCircle" class="on">วงเวท</button>
</div>
<div id="tag">ปีกสายลม · ธีมเวทมนตร์ · ลากเมาส์หมุน / scroll ซูม</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03100b);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.4, -11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.45, 0.55));
composer.addPass(new OutputPass());

const U = { time: { value: 0 } };

// ---------- feather material ----------
// uv.x = 0 root -> 1 tip, uv.y = -1..1 across the feather
const featherMat = new THREE.ShaderMaterial({
  uniforms: { time: U.time },
  vertexShader: `
    attribute float layer;
    varying vec2 vUv; varying float vL;
    void main(){ vUv = uv; vL = layer; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform float time;
    varying vec2 vUv; varying float vL;
    float h(float n){ return fract(sin(n)*43758.5453); }
    void main(){
      float u = vUv.x, v = abs(vUv.y);
      vec3 root = vec3(0.02, 0.28, 0.17);
      vec3 mid  = vec3(0.12, 0.85, 0.55);
      vec3 tip  = vec3(0.85, 1.0, 0.75);
      vec3 c = mix(root, mid, smoothstep(0.0, 0.55, u));
      c = mix(c, tip, smoothstep(0.6, 1.0, u));
      // soft glowing rim (no hard outline) + bright quill down the middle
      float rim = smoothstep(0.55, 1.0, v) * 0.55;
      float spine = exp(-v*14.0) * 0.9 * smoothstep(0.02, 0.2, u);
      // fine barbs: thin diagonal streaks like feather vanes
      float barb = smoothstep(0.75, 1.0, sin((u*40.0 - v*6.0) + vL*3.0)*0.5+0.5) * 0.18 * smoothstep(0.1, 0.4, v);
      // magic flowing root -> tip
      float flow = pow(sin((u*3.0 - time*0.8 + vL*0.37)*3.14159)*0.5+0.5, 8.0) * 0.6;
      // rune dots twinkling along the quill
      float cell = floor(u*14.0);
      float rune = step(0.6, h(cell + vL*11.0)) * smoothstep(0.35, 0.0, abs(fract(u*14.0)-0.5)) * exp(-v*6.0)
                 * (0.5 + 0.5*sin(time*3.0 + cell*1.7 + vL));
      float a = 0.16 + rim*0.8 + spine*0.5 + barb + flow*0.35 + rune*0.7;
      a *= smoothstep(1.0, 0.86, v);                 // feather the very edge
      vec3 col = c*(0.7 + flow) + vec3(0.9,1.0,0.8)*(spine*0.5 + rune) + mid*rim;
      gl_FragColor = vec4(col*a, a);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});

// one curved feather: quadratic bezier P0 -> C -> T, width w, curling to a sharp tip
function featherGeo(P0, C, T, w, layer, z, bulge = 1) {
  const N = 28, pos = [], uv = [], lay = [], idx = [];
  const p = new THREE.Vector2(), d = new THREE.Vector2();
  for (let i = 0; i <= N; i++) {
    const t = i / N, it = 1 - t;
    p.set(it * it * P0[0] + 2 * it * t * C[0] + t * t * T[0], it * it * P0[1] + 2 * it * t * C[1] + t * t * T[1]);
    d.set(2 * it * (C[0] - P0[0]) + 2 * t * (T[0] - C[0]), 2 * it * (C[1] - P0[1]) + 2 * t * (T[1] - C[1])).normalize();
    const nx = -d.y, ny = d.x;
    // fuller on the outer (lower) side, slim on the leading side, sharp tip
    const prof = Math.pow(Math.sin(Math.PI * Math.min(1, 0.15 + t * 0.9)), 0.7) * (1 - Math.pow(t, 3) * 0.6);
    const wo = w * prof * bulge, wi = w * prof * 0.55;
    pos.push(p.x + nx * wi, p.y + ny * wi, z, p.x - nx * wo, p.y - ny * wo, z);
    uv.push(t, 1, t, -1);
    lay.push(layer, layer);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('layer', new THREE.Float32BufferAttribute(lay, 1));
  g.setIndex(idx);
  return g;
}

// ---------- one wing (right side: +x outward, +y up) ----------
// silhouette from the reference: tall crest curling up at the outer top,
// long primaries sweeping out, shorter feathers fanning down near the body
const PRIMARIES = [
  // root,         control,       tip,           width
  [[0.35, 0.55], [2.7, 0.9], [3.3, 3.4], 0.42],
  [[0.45, 0.4], [2.6, 0.55], [4.0, 2.3], 0.38],
  [[0.55, 0.22], [2.6, 0.2], [4.2, 1.25], 0.36],
  [[0.65, 0.05], [2.5, -0.25], [3.85, 0.15], 0.34],
  [[0.75, -0.1], [2.2, -0.65], [3.2, -0.75], 0.32],
  [[0.85, -0.2], [1.9, -0.95], [2.45, -1.5], 0.3],
  [[0.9, -0.25], [1.5, -1.05], [1.75, -1.95], 0.27],
  [[0.85, -0.25], [1.05, -1.05], [1.05, -2.05], 0.24],
];
const COVERTS = [
  [[0.15, 0.35], [1.4, 1.15], [2.5, 0.95], 0.34],
  [[0.25, 0.15], [1.3, 0.55], [2.2, 0.25], 0.3],
  [[0.35, -0.05], [1.2, -0.05], [1.8, -0.5], 0.28],
  [[0.45, -0.15], [1.0, -0.45], [1.25, -1.05], 0.24],
];
function makeWing() {
  const wing = new THREE.Group();
  const feathers = [];
  const add = (list, z0, off) => list.forEach(([P0, C, T, w], i) => {
    const piv = new THREE.Group();
    piv.position.set(P0[0], P0[1], 0);
    const rel = a => [a[0] - P0[0], a[1] - P0[1]];
    piv.add(new THREE.Mesh(featherGeo([0, 0], rel(C), rel(T), w, i + off, z0 + i * 0.03), featherMat));
    piv.userData = { i: i + off, spread: off ? 0.15 : 1 };
    wing.add(piv);
    feathers.push(piv);
  });
  add(PRIMARIES, 0, 0);
  add(COVERTS, -0.12, 10);
  wing.userData.feathers = feathers;
  return wing;
}

const rig = new THREE.Group();
rig.position.y = 1.4;
scene.add(rig);
const R = makeWing(), L = makeWing();
L.scale.x = -1;
const pivR = new THREE.Group(), pivL = new THREE.Group();
pivR.position.set(0.2, 0, 0); pivL.position.set(-0.2, 0, 0);
pivR.add(R); pivL.add(L);
rig.add(pivR, pivL);

// ---------- magic circle behind the back (canvas-drawn runes) ----------
function circleTex() {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'); g.translate(S / 2, S / 2);
  g.strokeStyle = '#bfffe0'; g.fillStyle = '#bfffe0'; g.lineCap = 'round';
  const ring = (r, w) => { g.lineWidth = w; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke(); };
  ring(240, 4); ring(222, 2); ring(150, 3); ring(136, 1.5); ring(60, 2);
  // runes between the outer rings
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 28; k++) {
    g.save(); g.rotate(k / 28 * Math.PI * 2); g.translate(0, -231); g.lineWidth = 2; g.beginPath();
    for (let s = 0; s < 3; s++) { g.moveTo((rnd() - 0.5) * 12, (rnd() - 0.5) * 10); g.lineTo((rnd() - 0.5) * 12, (rnd() - 0.5) * 10); }
    g.stroke(); g.restore();
  }
  // wind star: two overlapped triangles + swirl hooks
  g.lineWidth = 2.5;
  for (const r0 of [0, Math.PI / 3]) {
    g.beginPath();
    for (let k = 0; k <= 3; k++) { const a = r0 + k / 3 * Math.PI * 2 - Math.PI / 2; g[k ? 'lineTo' : 'moveTo'](Math.cos(a) * 150, Math.sin(a) * 150); }
    g.stroke();
  }
  for (let k = 0; k < 6; k++) {
    g.save(); g.rotate(k / 6 * Math.PI * 2); g.beginPath(); g.arc(0, -100, 22, Math.PI * 0.2, Math.PI * 1.5); g.stroke(); g.restore();
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const circle = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2), new THREE.MeshBasicMaterial({
  map: circleTex(), color: 0x6fffbf, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
}));
circle.position.set(0, 0.2, -0.3);
rig.add(circle);

// ghost character for scale (faces +z; default camera looks at the back)
const body = new THREE.Group();
const ghost = new THREE.MeshBasicMaterial({ color: 0x0d2a1f, transparent: true, opacity: 0.6 });
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 1.1, 6, 12), ghost); torso.position.y = 1.0;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 14), ghost); head.position.y = 2.2;
const legA = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 1.1, 4, 8), ghost), legB = legA.clone();
legA.position.set(0.22, -0.3, 0); legB.position.set(-0.22, -0.3, 0);
body.add(torso, head, legA, legB);
body.position.set(0, 0.1, 0.55);
scene.add(body);

// ---------- sparkles: green + pale-gold motes drifting up off the feathers ----------
const N = 360;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(N * 3), sSeed = new Float32Array(N * 4);
for (let i = 0; i < N; i++) sSeed.set([Math.random(), Math.random(), Math.random(), Math.random() < 0.5 ? -1 : 1], i * 4);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('seed', new THREE.BufferAttribute(sSeed, 4));
const sMat = new THREE.ShaderMaterial({
  uniforms: { time: U.time, px: { value: renderer.getPixelRatio() } },
  vertexShader: `
    attribute vec4 seed; uniform float time, px; varying float vA; varying float vG;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vA = 0.35 + 0.65*pow(sin(time*(2.0+seed.z*4.0) + seed.x*40.0)*0.5+0.5, 3.0);
      vG = step(0.7, seed.y);
      gl_PointSize = (3.0 + seed.z*5.0) * px * (10.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA; varying float vG;
    void main(){
      vec2 q = gl_PointCoord - 0.5; float r = length(q);
      float star = max(exp(-r*9.0), (exp(-abs(q.x)*40.0) + exp(-abs(q.y)*40.0)) * exp(-r*5.0) * 0.6);
      vec3 c = mix(vec3(0.55,1.0,0.75), vec3(1.0,0.95,0.6), vG);
      gl_FragColor = vec4(c*star*vA, star*vA);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
rig.add(new THREE.Points(sGeo, sMat));

const grid = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshBasicMaterial({ color: 0x0b3b28, transparent: true, opacity: 0.18 }));
grid.rotation.x = -Math.PI / 2; grid.position.y = -0.95;
scene.add(grid);

// ---------- UI ----------
const st = { flap: true, open: 1, target: 1 };
const btn = id => document.getElementById(id);
btn('bFlap').onclick = e => { st.flap = !st.flap; e.target.classList.toggle('on', st.flap); };
btn('bSpin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); };
btn('bFold').onclick = () => { st.target = st.target ? 0 : 1; };
btn('bBack').onclick = () => camera.position.set(0, 1.4, -11);
btn('bFront').onclick = () => camera.position.set(0, 1.4, 11);
btn('bBody').onclick = e => { body.visible = !body.visible; e.target.classList.toggle('on', body.visible); };
btn('bCircle').onclick = e => { circle.visible = !circle.visible; e.target.classList.toggle('on', circle.visible); };
const q = new URLSearchParams(location.search);
if (q.get('view') === 'front') camera.position.set(0, 1.4, 11);
if (q.get('view') === 'side') camera.position.set(-9, 2.6, -6);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------- animate ----------
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  U.time.value = t;
  st.open += (st.target - st.open) * 0.06;
  const o = st.open;
  const flap = st.flap ? Math.sin(t * 2.0) : 0;

  pivR.rotation.y = -0.3 - flap * 0.22 - (1 - o) * 1.1;
  pivL.rotation.y = 0.3 + flap * 0.22 + (1 - o) * 1.1;
  pivR.rotation.z = flap * 0.08 - (1 - o) * 0.6;
  pivL.rotation.z = -flap * 0.08 + (1 - o) * 0.6;
  // feathers fan open / close and ripple a little after the beat
  for (const w of [R, L]) for (const f of w.userData.feathers) {
    const d = f.userData;
    f.rotation.z = -(1 - o) * (0.12 * d.i) * d.spread + Math.sin(t * 2.0 - d.i * 0.3) * 0.035;
  }
  rig.position.y = 1.4 + Math.sin(t * 1.0) * 0.07;
  circle.rotation.z = t * 0.25;
  circle.material.opacity = 0.45 + Math.sin(t * 1.7) * 0.1;

  // sparkles: spawn along the wing span, drift up + outward, loop
  for (let i = 0; i < N; i++) {
    const a = sSeed[i * 4], b = sSeed[i * 4 + 1], c = sSeed[i * 4 + 2], side = sSeed[i * 4 + 3];
    const life = (t * (0.12 + c * 0.15) + a) % 1;
    const x0 = 0.6 + b * 3.6 * o, y0 = -1.8 + (1 - b) * 3.6 * (0.4 + 0.6 * b);
    sPos[i * 3] = side * (x0 + life * 0.6 + Math.sin(life * 6 + a * 30) * 0.15);
    sPos[i * 3 + 1] = y0 * 0.8 + life * 2.2;
    sPos[i * 3 + 2] = -0.2 + (c - 0.5) * 0.8;
  }
  sGeo.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
