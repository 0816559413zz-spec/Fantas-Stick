<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Skyloom Spire — 3 phases (sketch)</title>
<style>
html,body{margin:0;background:#f4eee0;font-family:"Segoe UI",Tahoma,sans-serif;color:#3a3226}
svg{display:block}
text{font-family:"Segoe UI",Tahoma,sans-serif}
</style></head><body>
<!-- Explanatory side-elevation sketch only. NOT an approved castle layout. -->
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .36  0 0 0 .10 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfdbe6"/><stop offset=".7" stop-color="#ece6d6"/><stop offset="1" stop-color="#f4eee0"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe8f0" stop-opacity="0"/><stop offset=".5" stop-color="#9fe8f0" stop-opacity=".8"/><stop offset="1" stop-color="#d8fbff"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f6fb5"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#sky)"/>
<rect width="1200" height="760" filter="url(#paper)"/>

<!-- title + disclaimer -->
<text x="30" y="40" font-size="26" font-weight="700">Skyloom Spire (หอทอฟ้า) — ภาพอธิบาย 3 เฟส</text>
<text x="30" y="66" font-size="15" fill="#a2402e" font-weight="600">⚠ ภาพอธิบายคร่าว ๆ (มุมตัดด้านข้าง) — ไม่ใช่ layout ที่อนุมัติแล้ว ขนาด/ระยะ/จำนวนทางยังไม่กำหนด</text>

<!-- light tether -->
<rect x="747" y="0" width="16" height="250" fill="url(#beam)"/>
<rect x="753" y="0" width="4" height="250" fill="#ffffff" opacity=".9"/>
<text x="830" y="80" font-size="13" fill="#2d6f7a">สายแสงเวท (Tether) ขึ้นฟ้า</text>

<!-- sea / lagoon -->
<path d="M0,600 Q150,590 300,600 T600,600 T900,598 T1200,600 V760 H0z" fill="#8fb3c4" opacity=".75"/>
<path d="M0,620 Q200,612 400,622 T800,620 T1200,622" stroke="#eef5f7" stroke-width="2" fill="none" opacity=".7"/>

<!-- PHASE 1 ground: canal docks -->
<path d="M120,600 L560,600 L560,585 L120,585z" fill="#cdbb98" stroke="#5a4a35"/>
<g fill="#d9c9a8" stroke="#5a4a35">
  <rect x="150" y="545" width="46" height="40"/><path d="M146,545 L173,522 L200,545z"/>
  <rect x="215" y="530" width="38" height="55"/><path d="M211,530 L234,505 L257,530z"/>
  <rect x="300" y="550" width="60" height="35"/>
</g>
<!-- canal lock + tide wheel landmark -->
<rect x="420" y="520" width="16" height="80" fill="#9a8a6c" stroke="#4a3d2c"/>
<rect x="500" y="520" width="16" height="80" fill="#9a8a6c" stroke="#4a3d2c"/>
<rect x="410" y="512" width="116" height="12" fill="#b9a780" stroke="#4a3d2c"/>
<circle cx="468" cy="560" r="34" fill="none" stroke="#a5782f" stroke-width="5"/>
<g stroke="#a5782f" stroke-width="3"><line x1="434" y1="560" x2="502" y2="560"/><line x1="468" y1="526" x2="468" y2="594"/><line x1="444" y1="536" x2="492" y2="584"/><line x1="492" y1="536" x2="444" y2="584"/></g>
<circle cx="468" cy="560" r="8" fill="#5fd0dc" stroke="#2d6f7a"/>
<!-- canal boats -->
<path d="M30,612 h70 l-10,12 h-50z" fill="#7a5a3a"/><path d="M60,612 v-26 l18,22z" fill="#efe6d0" stroke="#7a5a3a"/>

<!-- PHASE 2: dome garden on plinth -->
<path d="M560,600 L940,600 L920,470 L580,470z" fill="#bfae8a" stroke="#5a4a35"/>
<path d="M600,470 A150,120 0 0 1 900,470z" fill="#dff0f2" fill-opacity=".55" stroke="#4f7f88" stroke-width="2"/>
<g stroke="#4f7f88" stroke-width="1" opacity=".7" fill="none">
  <path d="M640,470 Q750,330 860,470"/><path d="M690,470 Q750,355 810,470"/><path d="M750,350 V470"/>
  <path d="M612,430 H888"/><path d="M640,395 H860"/>
</g>
<path d="M820,372 l12,18 l-8,10 l14,14" stroke="#4f7f88" stroke-width="2" fill="none"/>
<!-- floating orrery landmark -->
<circle cx="752" cy="410" r="12" fill="#e6b65a" stroke="#7a5420"/>
<ellipse cx="752" cy="410" rx="44" ry="13" fill="none" stroke="#a5782f" stroke-width="2"/>
<ellipse cx="752" cy="410" rx="28" ry="30" fill="none" stroke="#a5782f" stroke-width="1.5" transform="rotate(30 752 410)"/>
<circle cx="796" cy="410" r="5" fill="#7fb7d6"/><circle cx="738" cy="384" r="4" fill="#c97a6a"/>
<!-- garden islets inside -->
<ellipse cx="660" cy="455" rx="28" ry="6" fill="#7f9a5c"/><ellipse cx="845" cy="448" rx="24" ry="5" fill="#7f9a5c"/>

<!-- PHASE 3: spire + crown -->
<path d="M730,370 L780,370 L772,180 L738,180z" fill="#d6cbb2" stroke="#5a4a35"/>
<path d="M700,180 L810,180 L820,165 L690,165z" fill="#c8b994" stroke="#5a4a35"/>
<rect x="680" y="150" width="150" height="16" fill="#b9a780" stroke="#5a4a35"/>
<!-- anchor crystal + rune rings landmark -->
<path d="M755,95 L775,128 L755,148 L735,128z" fill="#a9eef4" stroke="#2d6f7a" stroke-width="2"/>
<ellipse cx="755" cy="122" rx="46" ry="10" fill="none" stroke="#5fd0dc" stroke-width="2.5"/>
<ellipse cx="755" cy="122" rx="62" ry="14" fill="none" stroke="#5fd0dc" stroke-width="1.5" stroke-dasharray="6 5"/>
<!-- lantern lift cabin -->
<rect x="790" y="280" width="18" height="22" rx="4" fill="#f2c96b" stroke="#7a5420"/>
<line x1="799" y1="180" x2="799" y2="280" stroke="#7a5420" stroke-dasharray="3 3"/>

<!-- airship + brooms -->
<ellipse cx="1030" cy="200" rx="70" ry="20" fill="#cfc2a4" stroke="#5a4a35"/><rect x="1010" y="220" width="40" height="10" fill="#8b6a45"/>
<g stroke="#3a3226" stroke-width="2" fill="#3a3226"><line x1="300" y1="330" x2="340" y2="318"/><circle cx="322" cy="318" r="5"/></g>
<g stroke="#3a3226" stroke-width="2" fill="#3a3226"><line x1="980" y1="420" x2="1015" y2="430"/><circle cx="1000" cy="420" r="4"/></g>

<!-- attack flow -->
<path d="M90,575 C200,560 330,560 410,555" stroke="#2f6fb5" stroke-width="4" fill="none" marker-end="url(#ar)"/>
<path d="M540,560 C580,520 610,500 640,488" stroke="#2f6fb5" stroke-width="4" fill="none" marker-end="url(#ar)"/>
<path d="M880,430 C960,330 900,230 835,175" stroke="#2f6fb5" stroke-width="4" fill="none" stroke-dasharray="10 7" marker-end="url(#ar)"/>
<text x="905" y="300" font-size="12" fill="#2f6fb5">ไม้กวาด / กระเช้าโคม</text>
<text x="905" y="315" font-size="12" fill="#2f6fb5">(ช่วงถอย-ชิงของ — ไอเดีย)</text>

<!-- phase tags -->
<g font-size="14" font-weight="700">
  <rect x="120" y="640" width="440" height="100" rx="10" fill="#fffaf0" stroke="#5a4a35"/>
  <text x="135" y="662">เฟส 1 · ท่าคลองโคมลอย (Lantern Canals)</text>
  <text x="135" y="684" font-weight="400" font-size="13">สู้ในย่านคลอง สะพานเตี้ย ท่าเรือ ⇢ แกน 1 ที่ประตูกั้นน้ำ</text>
  <text x="135" y="704" font-weight="400" font-size="13">แลนด์มาร์ก: <tspan font-weight="700">ประตูน้ำกังหันจันทร์ (Moonlock Wheel)</tspan></text>
  <text x="135" y="724" font-weight="400" font-size="13">กังหันทองเหลืองยักษ์ หมุนตามน้ำขึ้นลง ตาผลึกฟ้ากลางวง</text>

  <rect x="580" y="640" width="300" height="100" rx="10" fill="#fffaf0" stroke="#5a4a35"/>
  <text x="595" y="662">เฟส 2 · สวนโดมแก้ว (Glass Garden)</text>
  <text x="595" y="684" font-weight="400" font-size="13">โดมแก้วร้าวคลุมสวนลอย ⇢ แกน 2</text>
  <text x="595" y="704" font-weight="400" font-size="13">แลนด์มาร์ก: <tspan font-weight="700">ออร์เรอรีลอยฟ้า</tspan></text>
  <text x="595" y="724" font-weight="400" font-size="13">ระบบดาวทองเหลืองหมุนใต้ยอดโดม</text>

  <rect x="900" y="640" width="280" height="100" rx="10" fill="#fffaf0" stroke="#5a4a35"/>
  <text x="915" y="662">เฟส 3 · มงกุฎหอ (Tether Crown)</text>
  <text x="915" y="684" font-weight="400" font-size="13">ลานยอดหอเหนือเมฆ ⇢ แกนสุดท้าย</text>
  <text x="915" y="704" font-weight="400" font-size="13">แลนด์มาร์ก: <tspan font-weight="700">ผลึกสมอดาว</tspan></text>
  <text x="915" y="724" font-weight="400" font-size="13">ผลึกลอยในวงอักษรรูน ปล่อยสายแสง</text>
</g>
<g font-size="20" font-weight="800" fill="#5a4a35">
  <circle cx="330" cy="500" r="16" fill="#fffaf0" stroke="#5a4a35"/><text x="324" y="507">1</text>
  <circle cx="620" cy="420" r="16" fill="#fffaf0" stroke="#5a4a35"/><text x="614" y="427">2</text>
  <circle cx="660" cy="125" r="16" fill="#fffaf0" stroke="#5a4a35"/><text x="654" y="132">3</text>
</g>
<text x="20" y="575" font-size="13" fill="#2f6fb5" font-weight="700">ทีมบุก (ฟ้า) ขึ้นฝั่ง →</text>
</svg>
</body></html>
