<title>Water VFX Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap">
<style>
/* Layout: one column of skill sections, GIF cards in an auto grid — deliberately single dark theme (deep-sea backdrop so the water colours read true) */
:root{--bg:#071530;--card:#0d2147;--line:#1e3d72;--fg:#e6f4ff;--dim:#93b6da;--acc:#12d6ff;--chip:#0b2c58;--btnfg:#03203d;
  --display:'Kanit',system-ui,sans-serif;--body:'Kanit',system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1{font:600 26px/1.25 var(--display);margin:0 0 4px;text-wrap:balance}
h1 b{color:var(--acc)}
.sub{color:var(--dim);margin:0 0 14px;max-width:68ch}
h2{font:600 19px var(--display);margin:30px 0 10px;padding-left:10px;border-left:4px solid var(--acc);text-wrap:balance}
h2 small{color:var(--dim);font-weight:400;font-size:14px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card img{width:100%;max-width:100%;aspect-ratio:2/1;object-fit:cover;display:block;background:#000}
.card.wide{grid-column:1/-1}
.card.wide img{aspect-ratio:auto;object-fit:contain}
.t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.n{font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.n code{font:12px var(--mono);color:var(--acc);background:var(--chip);border-radius:6px;padding:2px 6px}
.d{color:var(--dim);font-size:13.5px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--acc);color:var(--btnfg)}
.tag.old{background:var(--chip);color:var(--dim)}
textarea{width:100%;min-height:50px;resize:vertical;background:#081a3a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:13.5px var(--body)}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{background:var(--acc);color:var(--btnfg);border:0;border-radius:999px;padding:8px 16px;font:600 14px var(--body);cursor:pointer}
button.sec{background:var(--chip);color:var(--fg)}
#msg{color:var(--dim);font-size:13px}
#out{width:100%;font:13px var(--mono)}
.note{background:var(--chip);border:1px dashed var(--acc);border-radius:12px;padding:10px 14px;margin:22px 0 0;max-width:80ch}
</style>

<div class="wrap">
<h1>สายน้ำ — VFX <b>ออกแบบทีละสกิล</b></h1>
<p class="sub">GIF ถ่ายจากกล้องในเกม 12 เฟรม/วิ • พิมพ์ความเห็นใต้แต่ละอัน แล้วกด “คัดลอกความเห็น” ไปวางในแชท (ช่องว่าง = ผ่าน)</p>
<div class="bar"><button id="copy" type="button">คัดลอกความเห็น</button><button class="sec" id="clear" type="button">ล้าง</button><span id="msg" role="status"></span></div>
<div id="list"></div>
<textarea id="out" hidden readonly aria-label="ความเห็นทั้งหมด"></textarea>
<p class="note">VFX ทั้งหมดยังอยู่ในเครื่อง ยังไม่ขึ้นเว็บเกม • สกิลที่ติดป้าย “ร่าง 1 (2D)” คือของเก่า จะทำใหม่เป็นน้ำ 3D ทีละสกิลหลัง BA ผ่าน</p>
</div>
<script>
const S=[
 ['สไตล์น้ำ 3D (ต้นแบบ)','ตามรูปอ้างอิงที่ส่งมา',[
  ['water_vfx3d/style3d.gif','style3d','ก้อนน้ำ + เสี้ยวน้ำ 3D','ก้อนน้ำทึบ แรเงาการ์ตูน (สว่างฟ้า / เงาน้ำเงิน / ขอบขาว) • เสี้ยวน้ำ 3 วงพันรอบ • แฉกน้ำสาด • แอ่งน้ำค้างพื้น + วงกระเพื่อม • หยดน้ำ 3D ตกพื้น','new'],
  ['water_vfx3d/palette.jpg','palette','ชุดสี 3 แบบ (ก่อนปรับรอบ 4)','บน ฟ้าสด (ที่เลือก) • กลาง ฟ้าอมเขียว • ล่าง ฟ้า+เงาม่วง — รอบ 4 ทำให้สดกว่านี้แล้ว','wide']]],
 ['BA (คลิกซ้าย)','แบบใหม่ที่ตกลงกัน: สายน้ำไหลตามไม้ • น้ำใสขอบขาว • โดนแล้วแตก+เปียก',[
  ['water_vfx4/ba_slash.gif','ba_slash','ตวัดไม้ → สายน้ำ → 3 หยด','ไม้ลากสายน้ำใสเส้นเดียว ค้างกลางอากาศ แล้วบีบเป็นหยดพุ่งออกทีละหยด (0.25 / 0.45 / 0.65 วิ) หยดน้ำเล็กร่วง','new'],
  ['water_vfx4/ba_fly.gif','ba_fly','หยดน้ำพุ่ง','หยดน้ำใสยืดตัวตอนพุ่ง ขอบขาว หยดเล็กร่วงตามทาง','new'],
  ['water_vfx4/ba_hit.gif','ba_hit','โดน = แตก + เปียก','หยดแตกกระจาย หยดเล็กกระเด็นตกพื้น รอยเปียกจางๆ บนพื้น 1.4 วิ','new']]],
 ['โล่ (คลิกขวา)','ร่าง 1 (2D)',[
  ['water_vfx/shield_bubble.gif','shield_bubble','ฟองน้ำหุ้มตัว','ฟองใสลายแถบน้ำ + แถบขาวพัน + จานน้ำวนที่เท้า','old'],
  ['water_vfx/shield_heal.gif','shield_heal','กำลังฮีล','หยดน้ำเรืองลอยขึ้น + เส้นน้ำวนขึ้น','old']]],
 ['Dash (Shift)','ร่าง 1 (2D)',[
  ['water_vfx/dash_sink.gif','dash_sink','จมลงพื้น','จานน้ำวน + มงกุฎน้ำ + วงขาว','old'],
  ['water_vfx/dash_pop.gif','dash_pop','โผล่ออกมา','มงกุฎน้ำใหญ่ + วงขาวกว้าง + หยดน้ำ','old'],
  ['water_vfx/clone.gif','clone','ร่างโคลนน้ำ','ตัว+หัวลายน้ำ แถบน้ำพัน จานวนที่เท้า','old']]],
 ['สกิล 1 — Riptide','ร่าง 1 (2D)',[['water_vfx/riptide.gif','riptide','คลื่นยักษ์','สูง ~4 ม. กว้าง 10 ม. วิ่ง 20 ม.','old']]],
 ['สกิล 2 — Tidecaller Orb','ร่าง 1 (2D)',[['water_vfx/fam_orb.gif','fam_orb','ลูกน้ำผู้ช่วยที่ไหล่','ลูกน้ำเล็ก + แถบพัน + เส้นขาววน','old']]],
 ['สกิล 3 — Aqua Cage','ร่าง 1 (2D)',[
  ['water_vfx/cage_fly.gif','cage_fly','ฟองพุ่ง','ฟองใส แถบขาวพัน','old'],
  ['water_vfx/cage_bubble.gif','cage_bubble','ฟองขัง 2 วิ','ฟองน้ำใส ฟองเล็กลอยขึ้น จบแตกสาด','old']]],
 ['สกิล 4 — Abyssal Beam','ร่าง 1 (2D)',[
  ['water_vfx/beam_cast.gif','beam_cast','ร่าย 0.5 วิ','น้ำถูกดูดเข้าปลายไม้','old'],
  ['water_vfx/beam_loop.gif','beam_loop','ลำน้ำ 3 วิ','ลำน้ำ 35 ม. + วงขาวที่ปาก','old']]],
 ['สกิล 5 — Moonwater Arts','ร่าง 1 (2D)',[
  ['water_vfx/moon_aura.gif','moon_aura','ออร่า 8 วิ','จานน้ำวน + พระจันทร์เสี้ยว','old'],
  ['water_vfx/moon_beam.gif','moon_beam','ลำน้ำ BA','ลำน้ำ 45 ม. 0.6 วิ','old']]],
 ['อัลติ — Dragon of the Deep','ร่าง 1 (2D)',[
  ['water_vfx/dragon_intro.gif','dragon_intro','มังกรโผล่','เลื้อยวนรอบตัว แล้วขึ้นเหนือหัวขวา','old'],
  ['water_vfx/dragon_hover.gif','dragon_hover','ลอยรอเลือกจุด','หัวมังกร + ตัวน้ำขดวน','old'],
  ['water_vfx/dragon_dive.gif','dragon_dive','พุ่งลง + ดาเมจรัว 2 วิ','สายน้ำไหลลงต่อ น้ำสาด 10 ครั้ง','old']]],
];
const KEY='wtvfx-notes-r4';let notes={};try{notes=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}};
const L=document.getElementById('list');
for(const [h,sm,items] of S){const H=document.createElement('h2');H.textContent=h;if(sm){const s=document.createElement('small');s.textContent=sm;H.appendChild(s);}L.appendChild(H);
  const g=document.createElement('div');g.className='grid';L.appendChild(g);
  for(const [src,id,n,d,kind] of items){const c=document.createElement('div');c.className='card'+(kind==='wide'?' wide':'');
    const tag=kind==='new'?'<span class="tag">ใหม่ 3D</span>':kind==='old'?'<span class="tag old">ร่าง 1 (2D)</span>':'';
    c.innerHTML=`<img src="${src}" alt="${n}" loading="lazy"><div class="t"><div class="n"><span>${n}</span>${tag}</div><div class="d">${d} <code style="font:12px var(--mono);color:var(--acc)">${id}</code></div><textarea id="n-${id}" placeholder="ความเห็น / แก้อะไร"></textarea></div>`;
    const ta=c.querySelector('textarea');ta.value=notes[id]||'';ta.addEventListener('input',()=>{notes[id]=ta.value;save();});g.appendChild(c);}}
const msg=document.getElementById('msg'),out=document.getElementById('out');
document.getElementById('copy').addEventListener('click',()=>{const lines=[];for(const [h,,items] of S)for(const [,id,n] of items)if((notes[id]||'').trim())lines.push(`${h} / ${n} (${id}): ${notes[id].trim()}`);
  const txt=lines.length?lines.join('\n'):'ทุกอันผ่าน';
  navigator.clipboard.writeText(txt).then(()=>{msg.textContent='คัดลอกแล้ว — วางในแชทได้เลย';out.hidden=true;},()=>{out.hidden=false;out.value=txt;out.select();msg.textContent='คัดลอกเองจากกล่องด้านล่าง';});});
document.getElementById('clear').addEventListener('click',()=>{notes={};save();document.querySelectorAll('.card textarea').forEach(t=>t.value='');msg.textContent='ล้างแล้ว';});
</script>
