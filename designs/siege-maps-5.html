// Hand-drawn sketches of 5 proposed siege maps (Map Editor grid 140x50). render(i) draws map i.
const cv=document.getElementById('c'),g=cv.getContext('2d');
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const j=a=>(rnd()-.5)*2*a;
const INK={pencil:'#3b3a3f',main:'#1f4fa8',flank:'#d9741c',high:'#7a3fa0',freeze:'#3f9ad6',atk:'#b3262b',def:'#1f5fbf',green:'#2f7a3a',hi:'rgba(255,214,64,.42)',paper:'#f4efe2',grid:'rgba(90,120,160,.12)',soft:'#5b5a60',wood:'#8a5a2b',water:'rgba(70,140,210,.30)',ice:'rgba(150,205,235,.45)'};
const STY={multi:['หลายทาง','#d9741c'],breach:['ทุบเข้า','#8a5a2b'],climb:['ไต่ขึ้น','#7a3fa0'],cross:['ข้ามน้ำ','#1f6fb0'],sneak:['ลอบเข้า','#3b3a3f']};
const S=10.6,OX=58,OY=126;const P=(x,y)=>[OX+x*S,OY+y*S];

function stroke(pts,col,w,passes=2,amp=1){
  for(let p=0;p<passes;p++){
    g.beginPath();g.strokeStyle=col;g.lineWidth=w*(p?0.7:1);g.lineCap='round';g.lineJoin='round';g.globalAlpha=p?0.5:0.9;
    for(let i=0;i<pts.length-1;i++){
      const [x1,y1]=pts[i],[x2,y2]=pts[i+1],L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/36));
      if(i===0)g.moveTo(x1+j(amp),y1+j(amp));
      for(let k=1;k<=n;k++){const t=k/n,mx=x1+(x2-x1)*(t-.5/n),my=y1+(y2-y1)*(t-.5/n);
        g.quadraticCurveTo(mx+j(amp*1.5),my+j(amp*1.5),x1+(x2-x1)*t+j(amp),y1+(y2-y1)*t+j(amp));}
    }
    g.stroke();
  }
  g.globalAlpha=1;
}
const M=pts=>pts.map(p=>P(...p));
const line=(a,b,c,d,col=INK.pencil,w=2)=>stroke([P(a,b),P(c,d)],col,w,1,.4);
const poly=(pts,col=INK.pencil,w=2,close=true)=>stroke(M(close?[...pts,pts[0]]:pts),col,w);
const rect=(x,y,w,h,col=INK.pencil,lw=2)=>poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],col,lw);
function wash(x,y,w,h,col){g.save();g.globalCompositeOperation='multiply';g.fillStyle=col;const [a,b]=P(x,y);
  g.beginPath();g.moveTo(a+j(3),b+j(3));g.lineTo(a+w*S+j(3),b+j(3));g.lineTo(a+w*S+j(3),b+h*S+j(3));g.lineTo(a+j(3),b+h*S+j(3));g.closePath();g.fill();g.restore();}
function hatch(x,y,w,h,col=INK.pencil,gap=.8,ang=1,al=.4){g.save();const [a,b]=P(x,y);g.beginPath();g.rect(a,b,w*S,h*S);g.clip();
  for(let t=-h;t<w+h;t+=gap){const pts=[P(x+t,y),P(x+t+h*ang,y+h)];g.beginPath();g.strokeStyle=col;g.globalAlpha=al;g.lineWidth=1;
    g.moveTo(pts[0][0]+j(1),pts[0][1]);g.lineTo(pts[1][0]+j(1.5),pts[1][1]);g.stroke();}
  g.restore();g.globalAlpha=1;}
function clear(x1,y1,x2,y2,w=1.1){const [a,b]=P(x1,y1),[c,d]=P(x2,y2);g.strokeStyle=INK.paper;g.lineWidth=S*w;g.lineCap='butt';g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();}
function wall(pts){stroke(M(pts),INK.pencil,S*.7,1,.5);stroke(M(pts),INK.pencil,1.4,1,1);}
function brk(x1,y1,x2,y2){clear(x1,y1,x2,y2);const n=Math.max(3,Math.round(Math.hypot(x2-x1,y2-y1)/.9));const dx=y2-y1,dy=x1-x2,L=Math.hypot(dx,dy)||1;
  for(let k=0;k<=n;k++){const t=k/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;stroke([P(x-dx/L*.7,y-dy/L*.7),P(x+dx/L*.7,y+dy/L*.7)],INK.wood,2.2,1,.4);}}
function stairs(x1,y1,x2,y2){const v=Math.abs(x2-x1)<Math.abs(y2-y1);clear(x1,y1,x2,y2,1.2);for(let k=0;k<6;k++){const t=k/5;v?line(x1-.7,y1+(y2-y1)*t,x1+.7,y1+(y2-y1)*t,INK.pencil,1.4):line(x1+(x2-x1)*t,y1-.7,x1+(x2-x1)*t,y1+.7,INK.pencil,1.4);}}
function bridge(x,y,w,h){g.fillStyle=INK.paper;const [a,b]=P(x,y);g.fillRect(a,b,w*S,h*S);const hor=w>h;
  stroke(M(hor?[[x,y],[x+w,y]]:[[x,y],[x,y+h]]),INK.pencil,2,1,.6);stroke(M(hor?[[x,y+h],[x+w,y+h]]:[[x+w,y],[x+w,y+h]]),INK.pencil,2,1,.6);
  const n=Math.round((hor?w:h)/1.2);for(let k=1;k<n;k++){const t=k/n;hor?line(x+w*t,y,x+w*t,y+h,INK.wood,1.2):line(x,y+h*t,x+w,y+h*t,INK.wood,1.2);}}
function tier(x,y,w,h,l){rect(x,y,w,h,INK.pencil,2.4);const d={'+3':[1.5,.14],'+4':[1.2,.18],'+6':[.8,.28]}[l]||[1.8,.1];hatch(x,y,w,h,'#7a3fa0',d[0],.6,d[1]);txt(l,x+.6,y+h-.8,{size:13,bold:1,col:'#7a3fa0'});}
function bld(x,y,w,h){rect(x,y,w,h,INK.pencil,1.8);hatch(x,y,w,h,INK.pencil,.9,1,.3);}
function rock(x,y,w,h){hatch(x,y,w,h,INK.pencil,.6,.4,.32);hatch(x,y,w,h,INK.pencil,1.1,-.8,.2);}
function dark(x,y,w,h){g.save();g.globalCompositeOperation='multiply';g.fillStyle='rgba(60,58,70,.10)';const [a,b]=P(x,y);g.fillRect(a,b,w*S,h*S);g.restore();hatch(x,y,w,h,INK.pencil,1.5,.3,.12);}
function tunnel(pts,w=1.4){stroke(M(pts),INK.paper,S*w*2,1,.3);stroke(M(pts.map(([x,y])=>[x,y-w])),INK.pencil,1.5,1,.6);stroke(M(pts.map(([x,y])=>[x,y+w])),INK.pencil,1.5,1,.6);}
function trees(x,y,w,h,n,col='#4f7f45'){for(let i=0;i<n;i++){const [a,b]=P(x+rnd()*w,y+rnd()*h);stroke([[a-3,b+3],[a,b-4],[a+3,b+3]],col,1.3,1,.4);}}
function graves(x,y,w,h,n){for(let i=0;i<n;i++){const [a,b]=P(x+rnd()*w,y+rnd()*h);stroke([[a,b-4],[a,b+4]],INK.soft,1.3,1,.3);stroke([[a-3,b-1.5],[a+3,b-1.5]],INK.soft,1.3,1,.3);}}
function arrow(pts,col,w=2.4,dash){if(dash)g.setLineDash(dash);
  const sp=[];for(let i=0;i<pts.length-1;i++){const [x1,y1]=pts[i],[x2,y2]=pts[i+1];for(let t=0;t<1;t+=.34)sp.push([x1+(x2-x1)*t,y1+(y2-y1)*t]);}
  sp.push(pts[pts.length-1]);stroke(M(sp),col,w,1,.8);g.setLineDash([]);
  const [ax,ay]=P(...pts[pts.length-2]),[bx,by]=P(...pts[pts.length-1]),a=Math.atan2(by-ay,bx-ax),L=12;
  stroke([[bx-Math.cos(a-.45)*L,by-Math.sin(a-.45)*L],[bx,by],[bx-Math.cos(a+.45)*L,by-Math.sin(a+.45)*L]],col,w,1,.4);}
function txt(s,x,y,{size=13,col=INK.pencil,rot=0,bold=0,px=0,align='left'}={}){const [a,b]=px?[x,y]:P(x,y);g.save();g.translate(a,b);g.rotate(rot+j(.01));g.fillStyle=col;g.textAlign=align;
  g.font=`${bold?600:400} ${size}px Mali, "Comic Sans MS", sans-serif`;String(s).split('\n').forEach((l,i)=>g.fillText(l,0,i*size*1.25));g.restore();}
function badge(n,x,y,col=INK.pencil){const [a,b]=P(x,y);g.fillStyle=INK.paper;g.beginPath();g.arc(a,b,9,0,7);g.fill();
  const p=[];for(let i=0;i<=26;i++){const t=i/24*Math.PI*2;p.push([a+Math.cos(t)*9,b+Math.sin(t)*9]);}stroke(p,col,1.6,1,.3);txt(n,a,b+4.5,{px:1,size:12,bold:1,col,align:'center'});}
function spawn(x,y,l,team){const col=team==='a'?INK.atk:INK.def,[a,b]=P(x,y);g.fillStyle=col;g.globalAlpha=.16;g.fillRect(a-13,b-13,26,26);g.globalAlpha=1;
  stroke([[a-13,b-13],[a+13,b-13],[a+13,b+13],[a-13,b+13],[a-13,b-13]],col,2.2,2,1);txt(l,a,b+5,{px:1,size:15,bold:1,col,align:'center'});}
function core(x,y,n){wash(x-4.2,y-2.8,8.4,5.6,INK.hi);const p=[];const o=rnd()*6;for(let i=0;i<=46;i++){const a=o+i/44*Math.PI*2;p.push(P(x+Math.cos(a)*3.7,y+Math.sin(a)*3.7));}
  g.setLineDash([8,6]);stroke(p,INK.pencil,2,1,.6);g.setLineDash([]);const [a,b]=P(x,y);stroke([[a,b-10],[a+8,b],[a,b+10],[a-8,b],[a,b-10]],INK.pencil,2.5,2,.4);txt('แกน '+n,x,y+5.4,{size:13,bold:1,align:'center'});}
function cross(x,y){const [a,b]=P(x,y),r=6;stroke([[a-r,b],[a+r,b]],INK.green,3,1,.3);stroke([[a,b-r],[a,b+r]],INK.green,3,1,.3);}
function chip(style,x,y){const [n,c]=STY[style];g.font='600 14px Mali';const w=g.measureText(n).width+18;g.save();g.globalAlpha=.16;g.fillStyle=c;g.fillRect(x,y-15,w,22);g.restore();

async function render(i){

  for(let y=0;y<=50;y+=5){const [,b]=P(0,y);g.beginPath();g.moveTo(OX,b);g.lineTo(OX+140*S,b);g.stroke();}
  txt(`แมพ ${i+1} · ${m.name}`,58,46,{px:1,size:28,bold:1});
  txt(m.en,58+g.measureText?0:0,0,{px:1,size:1});

  txt(m.mood,60,80,{px:1,size:14,col:INK.soft});
  // phase washes
  const PX=[[0,46],[46,47],[93,47]];
  m.phases.forEach(([st,nm,col],k)=>{wash(PX[k][0],0,PX[k][1],50,col);});
  m.draw();
  // phase dividers + labels
  [46,93].forEach(x=>{g.setLineDash([10,8]);stroke(M([[x,0],[x,50]]),'rgba(59,58,63,.55)',1.6,1,.6);g.setLineDash([]);});
  poly([[0,0],[140,0],[140,50],[0,50]],INK.pencil,1.4);
  m.phases.forEach(([st,nm],k)=>{const [a,b]=P(PX[k][0]+1,0);g.fillStyle='rgba(244,239,226,.85)';g.fillRect(a-4,b+4,250,26);txt(`เฟส ${k+1} · ${nm}`,a+2,b+22,{px:1,size:15,bold:1,col:STY[st][1]});});
  m.cores.forEach(c=>core(...c));m.heals.forEach(h=>cross(...h));

  m.spawns.forEach(s=>spawn(...s));m.badges.forEach(b=>badge(...b));
  // notes per phase
  const NY=706;m.notes.forEach(([st0,desc,cls],k)=>{const st=Object.keys(STY).find(q=>STY[q][0]===st0)||st0;const x=58+k*500;const cw=chip(st,x,NY);txt(`เฟส ${k+1}`,x+cw+10,NY+1,{px:1,size:14,bold:1});
