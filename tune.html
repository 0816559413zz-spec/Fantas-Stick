<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ปรับค่าเกม - Fantas Stick</title>
<!--
  เครื่องมือปรับค่าเกม (แยกจากเกม) — เปิดด้วย Tune.bat หรือ http://localhost:8765/tune.html (ต้องรันผ่าน python tools/serve.py จึงเซฟได้)
  ทำงานยังไง: โหลดเกมจริงใน iframe ด้านขวา → อ่านรายการค่าที่ปรับได้จาก WD.tuneDump() (js/73-tune.js) → แก้ค่า = WD.tuneSetKey() เห็นผลในเกมทันที
  เซฟ = เขียน assets/tune.json (เก็บเฉพาะค่าที่ต่างจากค่าในโค้ด) ผ่าน /api/save ของ serve.py • เกมทุกเครื่องอ่านไฟล์นี้ตอนเปิด
  เพิ่มค่าที่ปรับได้ = เพิ่มใน tuneBuild() (js/73-tune.js) หรือใส่ v:{...} ใน defSpell ของสกิล — หน้านี้ไม่ต้องแก้
-->
<style>
:root{--bg:#161616;--bg2:#1e1e1e;--bg3:#262626;--bg4:#2f2f2f;--ln:#3f3f3f;--tx:#e6e6e6;--mu:#9a9a9a;--ac:#4a8cff;--ch:#e8b84a;--ok:#5cc46a;--bad:#ff6a6a;--ui:'Segoe UI','Noto Sans Thai',Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 var(--ui)}
button{background:var(--bg4);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.on{background:#24395e;border-color:var(--ac)}
input{font:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--ln)}
#top h1{margin:0 8px 0 0;font-size:15px;font-weight:600}#top .sp{flex:1}
#stat{color:var(--mu)}#stat b{color:var(--ch)}#stat i{font-style:normal;color:var(--bad)}
#msg{color:var(--mu);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{display:grid;grid-template-columns:210px minmax(0,1fr) var(--pv,44%);min-height:0;overflow:hidden}
@media (max-width:1000px){#main{grid-template-columns:170px minmax(0,1fr) var(--pv,38%)}.row{grid-template-columns:minmax(110px,1fr) minmax(70px,1fr) 64px 26px}.row .df{display:none}#msg{display:none}}
#main.nopv{--pv:0px}#main.nopv #pv{display:none}
#side{background:var(--bg2);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#q{margin:10px;padding:7px 9px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:4px}
#only{margin:0 12px 8px;color:var(--mu);display:flex;gap:6px;align-items:center;cursor:pointer}
#groups{overflow-y:auto;flex:1;padding:0 6px 10px}
#groups button{display:flex;width:100%;text-align:left;margin:2px 0;background:none;border-color:transparent;gap:6px}
#groups button:hover{background:var(--bg3)}#groups button.on{background:var(--bg4);border-color:var(--ln)}
#groups button span{flex:1}#groups button small{color:var(--mu)}#groups button b{color:#111;background:var(--ch);border-radius:8px;padding:0 6px;font-size:11px}
#list{overflow-y:auto;padding:6px 18px 40px;min-height:0}
#list h2{font-size:16px;margin:14px 0 4px}#list h3{font-size:12px;color:var(--ac);margin:16px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--ln);font-weight:600}
.row{display:grid;grid-template-columns:minmax(190px,1.5fr) minmax(90px,1fr) 70px 60px 26px;gap:8px;align-items:center;padding:3px 6px;border-left:3px solid transparent;border-radius:3px}
.row:hover{background:var(--bg2)}
.row.ch{border-left-color:var(--ch);background:rgba(232,184,74,.07)}.row.ch .lb{color:var(--ch)}
.row.dirty .lb::after{content:' ●';color:var(--bad);font-size:10px}
.lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb small{color:var(--mu);margin-left:6px}
.row input[type=range]{width:100%;accent-color:var(--ac)}
.row input[type=number]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:3px;padding:3px 5px}
.row .df{color:var(--mu);font-size:11px;text-align:right}.row .rs{padding:0 4px;visibility:hidden}.row.ch .rs{visibility:visible}
.row input[type=checkbox]{justify-self:start;width:16px;height:16px;accent-color:var(--ac)}
#pv{display:flex;flex-direction:column;border-left:1px solid var(--ln);min-height:0}
#pvBar{display:flex;gap:6px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--ln);align-items:center}#pvBar span{color:var(--mu);flex:1}
#game{flex:1;border:0;width:100%;background:#000}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.85);font-size:15px;z-index:5}
#load.hide{display:none}
.empty{color:var(--mu);padding:30px 0}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>🎚️ ปรับค่าเกม</h1><span id="stat">กำลังโหลด…</span><span class="sp"></span><span id="msg"></span>
    <button id="bSave" class="pri" title="Ctrl+S">💾 เซฟ</button><button id="bDl" title="ดาวน์โหลด tune.json (ถ้าเซฟตรงไม่ได้)">⬇</button><button id="bRst" title="คืนทุกค่าเป็นค่าเดิมในโค้ด">↺ คืนทั้งหมด</button><button id="bPv" class="on" title="แสดง/ซ่อนเกมด้านขวา">👁 เกม</button>
  </div>
  <div id="main">
    <div id="side"><input id="q" placeholder="ค้นหา เช่น ดาเมจ, ไฟ, cd…" autocomplete="off"><label id="only"><input type="checkbox" id="onlyCh"> เฉพาะค่าที่แก้แล้ว</label><div id="groups"></div></div>
    <div id="list"></div>
    <div id="pv"><div id="pvBar"><span>เกมจริง — ค่าที่แก้มีผลทันที</span><button id="bTrain" title="เริ่มห้องฝึกในเกมด้านขวา">▶ ห้องฝึก</button><button id="bReload" title="โหลดเกมใหม่ (ค่าที่แก้ยังอยู่)">🔄</button></div><iframe id="game"></iframe></div>
  </div>
</div>
<div id="load">กำลังเปิดเกมเพื่ออ่านรายการค่า…</div>
<script>
const $=s=>document.querySelector(s),GAME='index.html?nosw&nointro&tunetool';
let W=null,data=[],tab=0,q='',onlyCh=false,ov={},file={};
const fmt=(v,st)=>st>=1?String(Math.round(v)):String(+(+v).toFixed(st>=0.1?1:st>=0.01?2:3));
function msg(t,c){const m=$('#msg');m.textContent=t;m.style.color=c||'';m.title=t;}
function boot(keep){$('#load').classList.remove('hide');const f=$('#game');f.src=GAME+'&t='+Date.now();
  let n=0;const iv=setInterval(()=>{n++;let w=null;try{w=f.contentWindow;}catch(e){}
    const ok=w&&w.WD&&w.WD.tuneDump&&(w.WD.TUNE.loaded||n>40);if(!ok){if(n>200){clearInterval(iv);$('#load').textContent='❌ เปิดเกมไม่ได้ — เปิดหน้านี้ผ่าน Tune.bat หรือ python tools/serve.py';}return;}
    clearInterval(iv);W=w.WD;
    if(keep)for(const k of Object.keys(keep))W.tuneSetKey(k,keep[k]);   // โหลดเกมใหม่: ใส่ค่าที่ยังไม่เซฟกลับเข้าไป
    pull();$('#load').classList.add('hide');},100);}
function pull(){data=W.tuneDump();ov=Object.assign({},W.TUNE.ov);file=Object.assign({},W.TUNE.file);render();}
function isCh(it){return it.key in ov;}
function isDirty(it){return ov[it.key]!==file[it.key];}
function stat(){const n=Object.keys(ov).length,d=data.flatMap(g=>g.items).filter(isDirty).length,all=data.reduce((a,g)=>a+g.items.length,0);
  $('#stat').innerHTML=`${all} ค่าที่ปรับได้ • แก้แล้ว <b>${n}</b>`+(d?` • <i>ยังไม่เซฟ ${d}</i>`:' • เซฟครบแล้ว');}
function rowHtml(it){const c=isCh(it)?' ch':'',d=isDirty(it)?' dirty':'';const v=it.v;
  if(it.bool)return `<div class="row${c}${d}" data-k="${it.key}"><span class="lb" title="${it.key}">${it.label}</span><input type="checkbox" class="n" ${v?'checked':''}><span></span><span class="df">เดิม ${it.def?'เปิด':'ปิด'}</span><button class="rs" title="คืนค่าเดิม">↺</button></div>`;
  return `<div class="row${c}${d}" data-k="${it.key}"><span class="lb" title="${it.key}">${it.label}</span><input type="range" class="s" min="${it.min}" max="${Math.max(it.max,v)}" step="${it.step}" value="${v}"><input type="number" class="n" step="${it.step}" value="${fmt(v,it.step)}"><span class="df">เดิม ${fmt(it.def,it.step)}</span><button class="rs" title="คืนค่าเดิม">↺</button></div>`;}
function render(){
  $('#groups').innerHTML=data.map((g,i)=>{const c=g.items.filter(isCh).length;return `<button data-g="${i}" class="${!q&&tab===i?'on':''}"><span>${g.name}</span>${c?`<b>${c}</b>`:`<small>${g.items.length}</small>`}</button>`;}).join('');
  const qq=q.trim().toLowerCase();let groups=qq||onlyCh?data:[data[tab]];let h='';
  for(const g of groups){if(!g)continue;let items=g.items;
    if(qq)items=items.filter(it=>(it.label+' '+it.key+' '+it.sec+' '+g.name).toLowerCase().includes(qq));
    if(onlyCh)items=items.filter(isCh);if(!items.length)continue;
    h+=`<h2>${g.name}</h2>`;let sec=null;for(const it of items){if(it.sec!==sec){sec=it.sec;h+=`<h3>${sec}</h3>`;}h+=rowHtml(it);}}
  $('#list').innerHTML=h||'<div class="empty">ไม่มีรายการ</div>';stat();}
function find(k){for(const g of data)for(const it of g.items)if(it.key===k)return it;}
function setVal(row,v,from){const it=find(row.dataset.k);if(!it||!W)return;
  W.tuneSetKey(it.key,v);it.v=+v;ov=Object.assign({},W.TUNE.ov);
  row.classList.toggle('ch',isCh(it));row.classList.toggle('dirty',isDirty(it));
  if(from!=='n'){const n=row.querySelector('.n');if(n&&n.type==='number')n.value=fmt(v,it.step);}
  if(from!=='s'){const s=row.querySelector('.s');if(s){if(+v>+s.max)s.max=v;s.value=v;}}
  const gi=data.findIndex(g=>g.items.includes(it)),gb=$(`#groups [data-g="${gi}"]`);if(gb){const c=data[gi].items.filter(isCh).length;gb.lastElementChild.outerHTML=c?`<b>${c}</b>`:`<small>${data[gi].items.length}</small>`;}
  stat();}
$('#list').addEventListener('input',e=>{const row=e.target.closest('.row');if(!row)return;
  if(e.target.classList.contains('s'))setVal(row,+e.target.value,'s');
  else if(e.target.type==='checkbox')setVal(row,e.target.checked?1:0,'n');
  else if(e.target.classList.contains('n')&&e.target.value!==''&&isFinite(+e.target.value))setVal(row,+e.target.value,'n');});
$('#list').addEventListener('click',e=>{if(!e.target.classList.contains('rs'))return;const row=e.target.closest('.row'),it=find(row.dataset.k);setVal(row,it.def);if(onlyCh)render();else{const c=row.querySelector('.n');if(c&&c.type==='checkbox')c.checked=!!it.def;}});
$('#groups').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=+b.dataset.g;q='';$('#q').value='';render();$('#list').scrollTop=0;});
$('#q').addEventListener('input',e=>{q=e.target.value;render();});
$('#onlyCh').addEventListener('change',e=>{onlyCh=e.target.checked;render();});
function save(){if(!W)return;msg('กำลังเซฟ…');
  fetch('/api/save?path=assets/tune.json',{method:'POST',body:W.tuneJson()}).then(r=>r.json()).then(j=>{
    if(j&&j.ok){W.tuneMarkSaved();file=Object.assign({},W.TUNE.file);render();msg('✅ เซฟลง assets/tune.json แล้ว ('+Object.keys(ov).length+' ค่า) — บอก Claude ให้ commit+push','var(--ok)');}
    else msg('❌ เซฟไม่ได้: '+((j&&j.err)||'?')+' — ใช้ ⬇ แทน','var(--bad)');
  }).catch(()=>msg('❌ เซฟไม่ได้ — ต้องเปิดผ่าน Tune.bat (serve.py) • ใช้ ⬇ ดาวน์โหลดแทน','var(--bad)'));}
$('#bSave').onclick=save;
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.code==='KeyS'){e.preventDefault();save();}});
$('#bDl').onclick=()=>{if(!W)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([W.tuneJson()],{type:'application/json'}));a.download='tune.json';a.click();msg('ดาวน์โหลดแล้ว — วางทับ assets/tune.json');};
$('#bRst').onclick=()=>{if(!W||!Object.keys(ov).length)return;if(!confirm('คืนทุกค่าเป็นค่าเดิมในโค้ด? (ยังไม่เซฟจนกว่าจะกดเซฟ)'))return;for(const k of Object.keys(ov))W.tuneSetKey(k,find(k).def);pull();msg('คืนค่าเดิมทั้งหมดแล้ว — กดเซฟเพื่อล้างไฟล์');};
$('#bPv').onclick=()=>{const m=$('#main');m.classList.toggle('nopv');$('#bPv').classList.toggle('on',!m.classList.contains('nopv'));};
$('#bReload').onclick=()=>boot(Object.assign({},ov));
$('#bTrain').onclick=()=>{try{const w=$('#game').contentWindow,d=w.document;d.querySelector('#btnSolo').click();setTimeout(()=>{w.WD.G.mode='train';w.WD.hostStart();msg('เริ่มห้องฝึกแล้ว — คลิกในเกมเพื่อเล่น, Esc ปล่อยเมาส์');},400);}catch(e){msg('เริ่มห้องฝึกไม่ได้: '+e.message,'var(--bad)');}};
addEventListener('beforeunload',e=>{if(data.flatMap(g=>g.items).some(isDirty)){e.preventDefault();e.returnValue='';}});
boot();
</script>
</body>
</html>
