<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Editor — Fantas Stick</title>
<!-- Map Editor (topdown): วาดความสูงพื้น, พื้นผิว, กำแพง, วางของ, จุด Interact, ทางเดิน/เส้นทาง, โซน, โน้ต แล้วบันทึกลง maps/<id>.json + .md + .png ให้ Claude อ่าน
     โค้ด: mapedit/editor.js • รูปแบบไฟล์: guides/MAP-FORMAT.md • กฎ UI: guides/TOOL-UI-RULES.md -->
<link rel="stylesheet" href="hub/tool-ui.css">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
.tl-bar{flex-wrap:wrap}
.tl-bar .grp{display:flex;gap:4px;align-items:center}
#mapSel{max-width:220px}
#stat{color:var(--tx2);font-size:12px;white-space:nowrap}
#stat.err{color:var(--serr)}#stat.ok{color:var(--sok)}#stat.warn{color:var(--swarn)}
main{flex:1;display:flex;min-height:0}
#tools{width:44px;background:var(--bg1);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto}
#tools button{width:36px;height:34px;font-size:16px;background:transparent;border:1px solid transparent;border-radius:var(--r);color:var(--tx2);cursor:pointer;position:relative}
#tools button:hover{background:var(--bg3);color:var(--tx)}
#tools button.on{background:var(--accBg);border-color:var(--acc);color:#fff}
#tools button kbd{position:absolute;right:2px;bottom:0;font:9px var(--fu);color:var(--tx3)}
#tools hr{width:28px;border:0;border-top:1px solid var(--ln);margin:4px 0}
#opts{width:212px;background:var(--bg1);border-right:1px solid var(--ln);overflow-y:auto;padding:8px 10px}
#side{width:300px;background:var(--bg1);border-left:1px solid var(--ln);overflow-y:auto}
#wrap{flex:1;position:relative;min-width:0;background:var(--bg0)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#status{display:flex;gap:14px;padding:3px 10px;background:var(--bg1);border-top:1px solid var(--ln);font:12px var(--fu);color:var(--tx2);white-space:nowrap;overflow:hidden}
#status #hint{font-family:var(--ui);color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
h3{margin:10px 0 6px;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
h3:first-child{margin-top:2px}
.sec{border-bottom:1px solid var(--ln);padding:8px 12px}
.sec>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--tx2);list-style:none;padding:2px 0}
.sec>summary::before{content:'▸ ';color:var(--tx3)}.sec[open]>summary::before{content:'▾ '}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row>label{width:84px;flex:none;color:var(--tx2);font-size:12px}
.row .tl-in,.row .tl-sel{flex:1;min-width:0;padding:3px 6px}
.row input[type=number]{width:64px;flex:none}
.row input[type=range]{flex:1;min-width:0}
textarea.tl-in{width:100%;min-height:54px;resize:vertical;padding:4px 6px}
.pal{display:grid;grid-template-columns:1fr;gap:2px}
.pal button{display:flex;align-items:center;gap:7px;text-align:left;font:inherit;font-size:12px;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:var(--r);padding:3px 6px;cursor:pointer}
.pal button:hover{background:var(--bg3)}
.pal button.on{background:var(--accBg);border-color:var(--acc)}
.pal .sw{width:16px;height:16px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px}
.pal .k{margin-left:auto;font:10px var(--fu);color:var(--tx3)}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{font:inherit;font-size:12px;padding:3px 7px;color:var(--tx2);background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r);cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chips button{font:inherit;font-size:11px;padding:1px 6px;color:var(--tx2);background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;cursor:pointer}
.chips button:hover{color:var(--tx);border-color:var(--tx3)}
.chk{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px;cursor:pointer}
.mut{color:var(--tx3);font-size:12px;line-height:1.5}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.btns .tl-btn{padding:3px 8px;font-size:12px}
.tl-btn.dng:hover{border-color:var(--serr);color:var(--serr)}
.rep{font-size:12px;line-height:1.55}
.rep .bad{color:var(--serr)}.rep .ok{color:var(--sok)}.rep .wn{color:var(--swarn)}
.rep ul{margin:3px 0;padding-left:16px}
.lnk{display:flex;align-items:center;gap:4px;font-size:12px;margin:2px 0}
.lnk span{flex:1}
.lnk button{font:inherit;font-size:11px;padding:0 5px;background:none;border:1px solid var(--ln2);color:var(--tx2);border-radius:3px;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
#modal.show{display:flex}
#modal .box{background:var(--bg1);border:1px solid var(--ln2);border-radius:6px;padding:14px 16px;width:340px}
#modal h2{margin:0 0 10px;font-size:15px}
#linkBanner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--accBg);border:1px solid var(--acc);color:#fff;padding:4px 12px;border-radius:var(--r);font-size:12px;display:none}
</style>
</head>
<body>
<div class="tl-bar">
  <a class="tl-home" href="hub.html">◂ Tool</a>
  <h1>Map Editor</h1>
  <div class="grp">
    <select id="mapSel" class="tl-sel" title="เลือกแผนที่"></select>
    <button class="tl-btn" id="bNew" title="สร้างแผนที่ใหม่">＋ ใหม่</button>
    <button class="tl-btn" id="bDup" title="ทำสำเนาแผนที่นี้">⧉ สำเนา</button>
    <button class="tl-btn dng" id="bDel" title="ย้ายไป maps/_deleted (กู้คืนได้)">🗑</button>
  </div>
  <div class="grp">
    <button class="tl-btn" id="bUndo" title="ย้อน (Ctrl+Z)">↶</button>
    <button class="tl-btn" id="bRedo" title="ทำซ้ำ (Ctrl+Y)">↷</button>
    <button class="tl-btn" id="bFit" title="ดูทั้งแผนที่ (F)">⤢</button>
  </div>
  <span class="sp"></span>
  <span id="stat">กำลังโหลด…</span>
  <div class="grp">
    <button class="tl-btn" id="bPng" title="ดาวน์โหลดภาพ PNG">PNG ↓</button>
    <button class="tl-btn" id="bJson" title="ดาวน์โหลดไฟล์ JSON">JSON ↓</button>
    <button class="tl-btn" id="bImp" title="นำเข้าไฟล์ JSON">นำเข้า</button>
    <button class="tl-btn pri" id="bSave" title="บันทึกลง maps/ ให้ Claude อ่าน (Ctrl+S)">💾 บันทึก</button>
  </div>
</div>
<main>
  <div id="tools"></div>
  <div id="opts"></div>
  <div id="wrap"><canvas id="cv" tabindex="0"></canvas><div id="linkBanner">คลิกของที่จะเชื่อม (คลิกซ้ำ = ยกเลิกเชื่อม) • Esc = เสร็จ</div></div>
  <div id="side"></div>
</main>
<div id="status"><span id="sCell">–</span><span id="sInfo"></span><span id="sZoom"></span><span id="hint"></span></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<script>{const s=document.createElement('script');s.src='mapedit/editor.js?t='+Date.now();document.body.append(s);} /* no stale cache while editing the tool */</script>
</body>
</html>
