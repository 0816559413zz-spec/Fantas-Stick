<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>โน้ตปัญหา — Fantas Stick</title>
<!-- โน้ตปัญหา (Bug Notes): จดปัญหา + แปะรูป → เก็บใน bugs/bugs.json + bugs/img/ แล้ว serve.py เขียน bugs/BUGS.md ให้ Claude อ่าน
     ต้องเปิดผ่าน tools/serve.py (ดับเบิลคลิก "Bug Notes.bat") • Claude: อ่าน bugs/BUGS.md -->
<style>
:root{--bg:#1b1d22;--pn:#24272e;--pn2:#2c3038;--ln:#3a3f49;--tx:#e6e8ec;--mu:#9aa0ab;--ac:#e8b84a;--red:#e5534b;--ok:#4fb477;--mid:#e0913a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI","Leelawadee UI",Tahoma,sans-serif;height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#1b1d22;border-color:var(--ac);font-weight:600}
button.on{background:var(--ac);color:#1b1d22;border-color:var(--ac)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln)}
header h1{font-size:17px;margin:0 8px 0 0}
#stat{margin-left:auto;color:var(--mu);font-size:13px}
#stat.err{color:var(--red)}
main{flex:1;display:flex;min-height:0}
#side{width:300px;border-right:1px solid var(--ln);display:flex;flex-direction:column;background:var(--pn)}
#flt{display:flex;gap:4px;padding:8px}
#flt button{flex:1;padding:4px 6px;font-size:13px}
#list{flex:1;overflow:auto}
.it{padding:9px 12px;border-bottom:1px solid var(--ln);cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.it:hover{background:var(--pn2)}
.it.sel{background:#3a3424;box-shadow:inset 3px 0 var(--ac)}
.it .t{flex:1;min-width:0}
.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.it .t small{color:var(--mu)}
.it.fixed .t b{text-decoration:line-through;color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dot.high{background:var(--red)}.dot.mid{background:var(--mid)}.dot.low{background:var(--ok)}
#ed{flex:1;overflow:auto;padding:16px 22px}
#empty{color:var(--mu);text-align:center;margin-top:12vh;font-size:17px;line-height:2}
#empty kbd,.hint kbd{background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:1px 6px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.row label{color:var(--mu);font-size:13px;min-width:70px}
#fTitle{flex:1;font-size:19px;font-weight:600;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
#fWhere{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:260px}
#fText{width:100%;min-height:150px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px;resize:vertical}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
#drop{border:2px dashed var(--ln);border-radius:8px;padding:14px;margin:12px 0;min-height:120px}
#drop.over{border-color:var(--ac);background:#2e2a20}
#imgs{display:flex;flex-wrap:wrap;gap:10px}
.im{position:relative;width:220px;height:140px;background:#111;border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.im .bt{position:absolute;top:4px;right:4px;display:flex;gap:4px}
.im .bt button{padding:2px 7px;font-size:13px;background:#000a}
.hint{color:var(--mu);font-size:13px;margin-top:8px}
#reply{background:#1f2c24;border:1px solid #2f5a3d;border-radius:6px;padding:10px 12px;margin:12px 0;white-space:pre-wrap}
#reply b{color:var(--ok)}
#zoom,#mk{position:fixed;inset:0;background:#000d;display:none;z-index:9;align-items:center;justify-content:center;flex-direction:column}
#zoom img{max-width:96vw;max-height:94vh}
#mk .bar{display:flex;gap:6px;padding:8px;align-items:center}
#mk canvas{max-width:96vw;max-height:84vh;cursor:crosshair;background:#111}
.col{width:24px;height:24px;border-radius:50%;border:2px solid #fff3;padding:0}
.col.on{border-color:#fff}
</style></head><body>
<header>
  <h1>🐞 โน้ตปัญหา</h1>
  <button class="pri" id="bNew">＋ โน้ตใหม่</button>
  <button id="bCopy" title="คัดลอกข้อความไปวางในแชท Claude">📋 คัดลอกข้อความส่ง Claude</button>
  <span id="stat">กำลังโหลด…</span>
</header>
<main>
  <div id="side">
    <div id="flt"><button data-f="open" class="on">ยังไม่แก้</button><button data-f="fixed">แก้แล้ว</button><button data-f="all">ทั้งหมด</button></div>
    <div id="list"></div>
  </div>
  <div id="ed"></div>
</main>
<div id="zoom"><img alt=""></div>
<div id="mk">
  <div class="bar">
    <button data-t="pen" class="on">✏️ ปากกา</button><button data-t="box">⬜ กรอบ</button><button data-t="arrow">➜ ลูกศร</button>
    <span style="width:10px"></span>
    <button class="col on" data-c="#ff3030" style="background:#ff3030"></button><button class="col" data-c="#ffd400" style="background:#ffd400"></button><button class="col" data-c="#2ee86b" style="background:#2ee86b"></button><button class="col" data-c="#3aa0ff" style="background:#3aa0ff"></button>
    <span style="width:10px"></span>
    <button id="mkUndo">↶ ย้อน</button><button id="mkCancel">ยกเลิก</button><button id="mkSave" class="pri">✔ ใช้รูปนี้</button>
  </div>
  <canvas></canvas>
</div>
<script>
const $=s=>document.querySelector(s);
const SEV={high:'🔴 ด่วน',mid:'🟠 ปานกลาง',low:'🟢 เล็กน้อย'};
const WHERE=['เกม — ต่อสู้','เกม — เมนู/ล็อบบี้','เกม — ออนไลน์','VFX Studio','แผนที่','ตัวละคร/โมเดล','เสียง','อื่น ๆ'];
let db={next:1,items:[]},cur=null,filter='open',saveT=0,dirty=false,online=false;

function stat(t,err){const s=$('#stat');s.textContent=t;s.className=err?'err':'';}
async function load(){
  try{const r=await fetch('/api/bugs',{cache:'no-store'});if(!r.ok)throw 0;db=await r.json();online=true;stat('พร้อม • บันทึกอัตโนมัติ');}
  catch(e){online=false;stat('⚠ ต้องเปิดผ่าน "Bug Notes.bat" (tools/serve.py) ถึงจะบันทึกได้',1);}
  if(cur)cur=db.items.find(b=>b.id===cur.id)||null;
  renderList();renderEd();
}
function save(now){
  dirty=true;stat('กำลังบันทึก…');clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{const r=await fetch('/api/bugs',{method:'POST',body:JSON.stringify(db)});const j=await r.json();if(!j.ok)throw j.err;dirty=false;stat('บันทึกแล้ว ✓ '+new Date().toLocaleTimeString('th-TH'));}
    catch(e){stat('⚠ บันทึกไม่ได้ — เปิดผ่าน "Bug Notes.bat" หรือยัง?',1);}
  },now?0:600);
}
function nowISO(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,19);}
function newBug(){
  const b={id:db.next++,title:'',text:'',where:'',sev:'mid',status:'open',created:nowISO(),updated:nowISO(),imgs:[],reply:''};
  db.items.push(b);cur=b;if(filter==='fixed')setFilter('open');renderList();renderEd();save();
  setTimeout(()=>$('#fTitle')&&$('#fTitle').focus(),0);return b;
}
function touch(){cur.updated=nowISO();renderList();save();}
function setFilter(f){filter=f;document.querySelectorAll('#flt button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));renderList();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderList(){
  const L=db.items.filter(b=>filter==='all'||(filter==='open'?b.status==='open':b.status!=='open')).sort((a,b)=>b.id-a.id);
  $('#list').innerHTML=L.length?L.map(b=>`<div class="it ${b.status!=='open'?'fixed':''} ${cur&&cur.id===b.id?'sel':''}" data-id="${b.id}">
    <span class="dot ${b.sev}"></span><div class="t"><b>#${b.id} ${esc(b.title||'(ยังไม่มีหัวข้อ)')}</b>
    <small>${esc(b.where||'')} ${b.imgs.length?'• 🖼 '+b.imgs.length:''} ${b.reply?'• 💬 Claude ตอบแล้ว':''}</small></div></div>`).join('')
    :`<div style="padding:16px;color:var(--mu)">ไม่มีโน้ตในหมวดนี้</div>`;
}
function renderEd(){
  const E=$('#ed');
  if(!cur){E.innerHTML=`<div id="empty">🐞 เจอปัญหาในเกม?<br>กด <kbd>PrtSc</kbd> / <kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> จับภาพ แล้วกด <kbd>Ctrl</kbd>+<kbd>V</kbd> ที่หน้านี้<br>= สร้างโน้ตใหม่พร้อมรูปทันที<br><br>หรือกด <b>＋ โน้ตใหม่</b></div>`;return;}
  const b=cur;
  E.innerHTML=`
  <div class="row"><input id="fTitle" placeholder="หัวข้อสั้น ๆ เช่น 'ไฟทะลุกำแพง'" value="${esc(b.title)}"></div>
  <div class="row"><label>เจอที่</label><input id="fWhere" list="wl" placeholder="เลือกหรือพิมพ์เอง" value="${esc(b.where)}"><datalist id="wl">${WHERE.map(w=>`<option value="${w}">`).join('')}</datalist>
    <label style="min-width:auto;margin-left:10px">ความสำคัญ</label><div class="seg" id="fSev">${Object.keys(SEV).map(k=>`<button data-v="${k}" class="${b.sev===k?'on':''}">${SEV[k]}</button>`).join('')}</div></div>
  <textarea id="fText" placeholder="เล่าว่าเกิดอะไร: ทำอะไรอยู่ → เห็นอะไร → ควรเป็นยังไง&#10;เช่น เล่นสาย Pyro ด่านปราสาท กดสกิล 2 ใส่กำแพง → ไฟทะลุกำแพงไปโดนศัตรู ควรจะชนกำแพงแล้วหยุด">${esc(b.text)}</textarea>
  <div id="drop"><div id="imgs">${b.imgs.map((p,i)=>`<div class="im"><img src="${p}?v=${b.updated}" data-i="${i}"><div class="bt"><button data-mk="${i}" title="วาดวง/ลูกศรชี้จุด">✏️</button><button data-del="${i}" title="ลบรูป">✕</button></div></div>`).join('')}</div>
    <div class="hint">📎 วางรูป <kbd>Ctrl</kbd>+<kbd>V</kbd> • ลากไฟล์รูปมาวาง • หรือ <button id="bPick">เลือกไฟล์…</button> • กด ✏️ บนรูปเพื่อวาดวงชี้จุดที่ผิด</div></div>
  ${b.reply?`<div id="reply"><b>💬 Claude ตอบ:</b>\n${esc(b.reply)}</div>`:''}
  <div class="row" style="margin-top:14px">
    <div class="seg" id="fSt"><button data-v="open" class="${b.status==='open'?'on':''}">⬜ ยังไม่แก้</button><button data-v="fixed" class="${b.status==='fixed'?'on':''}">✅ แก้แล้ว</button><button data-v="wont" class="${b.status==='wont'?'on':''}">➖ ไม่แก้</button></div>
    <span style="flex:1"></span><button id="bDel" style="color:var(--red)">🗑 ลบโน้ตนี้</button></div>
  <div class="hint">โน้ต #${b.id} • จดเมื่อ ${b.created.replace('T',' ').slice(0,16)}</div>`;
  $('#fTitle').oninput=e=>{b.title=e.target.value;touch();};
  $('#fWhere').oninput=e=>{b.where=e.target.value;touch();};
  $('#fText').oninput=e=>{b.text=e.target.value;touch();};
  $('#fSev').onclick=e=>{const v=e.target.dataset.v;if(!v)return;b.sev=v;touch();renderEd();};
  $('#fSt').onclick=e=>{const v=e.target.dataset.v;if(!v)return;b.status=v;touch();renderEd();};
  $('#bDel').onclick=()=>{if(!confirm('ลบโน้ต #'+b.id+' ทั้งรูป?'))return;db.items=db.items.filter(x=>x!==b);cur=null;renderList();renderEd();save(1);};
  $('#bPick').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>addFiles(i.files);i.click();};
  $('#imgs').onclick=e=>{const t=e.target;
    if(t.dataset.del!=null){b.imgs.splice(+t.dataset.del,1);touch();renderEd();}
    else if(t.dataset.mk!=null)markup(+t.dataset.mk);
    else if(t.tagName==='IMG'){$('#zoom img').src=t.src;$('#zoom').style.display='flex';}};
  const d=$('#drop');
  d.ondragover=e=>{e.preventDefault();d.classList.add('over');};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files);};
}

// รูป: ย่อให้กว้างไม่เกิน 1920, PNG ถ้าเล็กพอ ไม่งั้น JPEG → ส่งให้ serve.py เก็บใน bugs/img/
function fileToCanvas(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1920/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c);};im.onerror=no;im.src=u;});}
function canvasData(c){let d=c.toDataURL('image/png');if(d.length>1.4e6)d=c.toDataURL('image/jpeg',0.86);return d;}
async function upload(data){const r=await fetch('/api/bug-img?name=b'+cur.id+'_'+Date.now().toString(36),{method:'POST',body:data});const j=await r.json();if(!j.ok)throw j.err;return j.path;}
async function addFiles(fl){
  const fs=[...fl].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;
  if(!online){stat('⚠ ยังแปะรูปไม่ได้ — เปิดผ่าน "Bug Notes.bat" ก่อน',1);return;}
  if(!cur)newBug();
  stat('กำลังเก็บรูป…');
  try{for(const f of fs){cur.imgs.push(await upload(canvasData(await fileToCanvas(f))));}touch();renderEd();}
  catch(e){stat('⚠ เก็บรูปไม่ได้: '+e,1);}
}
document.addEventListener('paste',e=>{
  const fs=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file').map(i=>i.getAsFile());
  if(fs.length){e.preventDefault();addFiles(fs);}
});

// วาดวง/กรอบ/ลูกศรบนรูป
const MK={tool:'pen',col:'#ff3030',ops:[],base:null,i:0,cv:$('#mk canvas')};
function markup(i){
  const im=new Image();im.onload=()=>{const c=MK.cv;c.width=im.width;c.height=im.height;MK.base=im;MK.ops=[];MK.i=i;mkDraw();$('#mk').style.display='flex';};
  im.src=cur.imgs[i]+'?v='+Date.now();
}
function mkDraw(){
  const c=MK.cv,g=c.getContext('2d');g.drawImage(MK.base,0,0);
  g.lineCap=g.lineJoin='round';
  for(const o of MK.ops){g.strokeStyle=g.fillStyle=o.c;g.lineWidth=Math.max(4,c.width/250);
    const [a,b]=[o.p[0],o.p[o.p.length-1]];g.beginPath();
    if(o.t==='pen'){o.p.forEach((p,k)=>k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();}
    else if(o.t==='box'){g.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);}
    else{g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();const an=Math.atan2(b[1]-a[1],b[0]-a[0]),h=g.lineWidth*4.5;
      g.beginPath();g.moveTo(b[0],b[1]);g.lineTo(b[0]-h*Math.cos(an-0.45),b[1]-h*Math.sin(an-0.45));g.lineTo(b[0]-h*Math.cos(an+0.45),b[1]-h*Math.sin(an+0.45));g.fill();}}
}
function mkPt(e){const r=MK.cv.getBoundingClientRect();return [(e.clientX-r.left)*MK.cv.width/r.width,(e.clientY-r.top)*MK.cv.height/r.height];}
MK.cv.onpointerdown=e=>{MK.cv.setPointerCapture(e.pointerId);MK.ops.push({t:MK.tool,c:MK.col,p:[mkPt(e)]});mkDraw();};
MK.cv.onpointermove=e=>{if(!e.buttons||!MK.ops.length)return;const o=MK.ops[MK.ops.length-1];if(o.t==='pen')o.p.push(mkPt(e));else o.p[1]=mkPt(e);mkDraw();};
$('#mk .bar').onclick=async e=>{const t=e.target;
  if(t.dataset.t){MK.tool=t.dataset.t;document.querySelectorAll('#mk [data-t]').forEach(x=>x.classList.toggle('on',x===t));}
  if(t.dataset.c){MK.col=t.dataset.c;document.querySelectorAll('#mk .col').forEach(x=>x.classList.toggle('on',x===t));}
  if(t.id==='mkUndo'){MK.ops.pop();mkDraw();}
  if(t.id==='mkCancel')$('#mk').style.display='none';
  if(t.id==='mkSave'){if(MK.ops.length){try{cur.imgs[MK.i]=await upload(canvasData(MK.cv));touch();renderEd();}catch(err){stat('⚠ เก็บรูปไม่ได้: '+err,1);}}$('#mk').style.display='none';}
};

$('#zoom').onclick=()=>$('#zoom').style.display='none';
$('#bNew').onclick=newBug;
$('#flt').onclick=e=>{if(e.target.dataset.f)setFilter(e.target.dataset.f);};
$('#list').onclick=e=>{const it=e.target.closest('.it');if(!it)return;cur=db.items.find(b=>b.id===+it.dataset.id);renderList();renderEd();};
$('#bCopy').onclick=async()=>{
  const open=db.items.filter(b=>b.status==='open');
  const msg=cur&&cur.status==='open'?`ดูโน้ตปัญหา #${cur.id} (${cur.title||'ไม่มีหัวข้อ'}) ใน bugs/BUGS.md แล้วแก้ให้หน่อย`
    :`ดูโน้ตปัญหาที่ยังไม่แก้ใน bugs/BUGS.md (${open.length} เรื่อง: ${open.map(b=>'#'+b.id).join(', ')}) แล้วแก้ให้หน่อย`;
  try{await navigator.clipboard.writeText(msg);stat('คัดลอกแล้ว — ไปวางในแชท Claude ได้เลย ✓');}catch(e){prompt('คัดลอกข้อความนี้:',msg);}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#zoom').style.display='none';$('#mk').style.display='none';}});
window.addEventListener('focus',()=>{if(!dirty)load();}); // Claude อาจตอบ/แก้สถานะมาแล้ว
load();
</script>
</body></html>
